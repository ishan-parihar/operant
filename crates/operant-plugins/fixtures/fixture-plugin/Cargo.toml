[package]
name = "fixture-echo"
version = "0.1.0"
edition = "2021"

# Standalone crate (own workspace): it targets wasm32-wasip1 and must never
# join the host workspace's build.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
