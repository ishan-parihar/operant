[package]
name = "operant-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Memory backends, embeddings, consolidation, and retrieval for Operant."
publish = false

[dependencies]
operant-api.workspace = true
operant-config = { workspace = true, default-features = true }
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
parking_lot = "0.12"
regex = "1.10"
reqwest = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
tokio = { version = "1.36", default-features = false, features = ["fs", "sync", "time"] }
tracing = { version = "0.1", default-features = false }
uuid = { version = "1.7", default-features = false, features = ["v4", "std"] }
postgres = { version = "0.19", features = ["with-chrono-0_4"], optional = true }

[features]
memory-postgres = ["dep:postgres"]

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros"] }
