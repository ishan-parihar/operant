[package]
name = "operant-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LLM provider implementations for Operant."
publish = false

[dependencies]
operant-api.workspace = true
operant-config = { workspace = true, default-features = true }
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
directories = "6.0"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hex = "0.4"
hmac = "0.12"
parking_lot = "0.12"
rand = "0.8"
regex = "1.10"
reqwest = { workspace = true, features = ["blocking", "stream"] }
ring = "0.17"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.36", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "fs"] }
tokio-stream = { version = "0.1", default-features = false, features = ["fs", "sync"] }
tracing = { version = "0.1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
uuid = { version = "1.7", default-features = false, features = ["v4", "std"] }

[dev-dependencies]
tempfile = "3.10"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
axum = { workspace = true, features = ["json", "ws", "macros", "tokio", "query", "http1"] }
scopeguard = "1.2"
wiremock = "0.6"

[lints]
workspace = true
