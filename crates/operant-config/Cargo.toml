[package]
name = "operant-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Configuration schema, secrets, and related types for Operant."
publish = false

[dependencies]
operant-api.workspace = true
operant-macros.workspace = true
anyhow = "1.0"
async-trait = "0.1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
directories = "6.0"
hex = "0.4"
parking_lot = "0.12"
rand = "0.8"
regex = "1.10"
reqwest = { workspace = true }
rustls = "0.23"
rustls-pki-types = "1"
schemars = { version = "0.8", features = ["derive"], optional = true }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
shellexpand = "3.1"
thiserror = "2.0"
tokio = { version = "1.36", default-features = false, features = ["fs", "io-util", "sync"] }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-socks = "0.5"
toml = "0.8"
toml_edit = "0.22"
tracing = { version = "0.1", default-features = false }
url = "2.5"
uuid = { version = "1.7", default-features = false, features = ["v4", "std"] }
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[features]
default = ["schema-export"]
schema-export = ["dep:schemars"]
channel-nostr = []
voice-wake = []

[lints]
workspace = true
