[package]
name = "operant-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Configuration schema, secrets, and related types for Operant."
publish = false

[dependencies]
operant-api.workspace = true
anyhow = "1.0"
directories = "6.0"
reqwest = { workspace = true }
# One crypto provider, named — see the note in operant-core/Cargo.toml:
# with `aws_lc_rs` AND `ring` both enabled, `rustls::ClientConfig::builder()`
# panics, which broke every proxied WebSocket connection.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars = { version = "0.8", features = ["derive"], optional = true }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.36", default-features = false, features = ["fs", "io-util", "sync"] }
toml = "0.8"
tracing = { version = "0.1", default-features = false }
url = "2.5"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[features]
default = ["schema-export"]
schema-export = ["dep:schemars"]
voice-wake = []

[lints]
workspace = true
