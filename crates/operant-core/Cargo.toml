[package]
name = "operant-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Core library for Operant: A high-performance ReAct agent framework"
readme = "README.md"
keywords = ["ai", "agent", "llm", "hermes", "react"]
categories = ["ai", "asynchronous", "network-programming"]

[dependencies]
# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
axum = { workspace = true }

# Networking
reqwest = { workspace = true }
url = { workspace = true }
tokio-tungstenite = { workspace = true }
# TLS for the EmailAdapter's SMTP STARTTLS upgrade (iter-125). Used by the
# gateway to refuse plaintext SMTP AUTH and require an encrypted channel.
rustls = "0.23"
rustls-native-certs = "0.7"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
toml = { workspace = true }
serde_yaml = "0.9"

# Provider profiles + cross-provider fallback chain ([providers] section)
operant-config = { path = "../operant-config" }
operant-harness = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
bytes = { workspace = true }
regex = "1.10"
dirs = { workspace = true }
shell-words = "1.1.1"
base64 = "0.22"
kokoro-tiny = "0.1.0"
hound = "3.5"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.7", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
which = "6.0"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# Chromium cookie v10 decryption (AES-128-CBC) — browser cookie import.
aes = "0.8.4"
cbc = "0.1.2"
constant_time_eq = "0.3"
flate2 = "1.0"
tar = "0.4"
tempfile = { workspace = true }
image = { workspace = true }

# Baked-in engines (not subprocess): memory-wire replaces agentmemory.
# sourcehound_mcp HELD OUT — see below.
#
# memory-wire is pinned to the v0.4.0 tag, not a branch. On `branch = "main"`
# the resolution broke on 2026-09-29 the moment memory-wire published a release
# requiring a newer `anyhow` than this lockfile held: a floating branch means any
# upstream release can break this build with no commit here. A tag is
# reproducible and is what "pin at release time" in
# docs/FULL-SCALE-IMPLEMENTATION-PLAN.md (P0/P2) asks for.
#
# To move it: change the rev, then `cargo update -p memory-wire`.
memory-wire = { git = "https://github.com/ishan-parihar/memory-wire", rev = "986d1b54945e4b54b8e3a90ad37f8904987a09b6" } # v0.4.0
# sourcehound_mcp = { package = "sourcehound", git = "https://github.com/ishan-parihar/sourcehound", branch = "master" }
# HELD (round 2): vendored obscura-render breaks against registry taffy 0.12.2
# (needs vendored 0.12.1 APIs) + cosmic-text feature-union divergence — 36 errors.
# See diagnosis before re-adding; fallback is subprocess over their MCP server.

[features]
default = ["agentmemory"]
anthropic = []
# agentmemory — hybrid semantic memory via the agentmemory server (REST + MCP)
agentmemory = []

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.4"
tracing-subscriber = { workspace = true }
serial_test = "3.2"
tempfile = { workspace = true }

[lints]
workspace = true
