[package]
name = "operant-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Core library for Operant: A high-performance ReAct agent framework"
readme = "README.md"
keywords = ["ai", "agent", "llm", "hermes", "react"]
categories = ["ai", "asynchronous", "network-programming"]

[dependencies]
# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
axum = { workspace = true }
# Unpoisoned locks where call sites would otherwise unwrap (house rule)
parking_lot = { workspace = true }
# Surgical config writes (2026-10-16 audit plan 09): persist one key in
# the loaded TOML, keeping comments and every other key byte-for-byte.
toml_edit = "0.22"

# Networking
reqwest = { workspace = true }
url = { workspace = true }
tokio-tungstenite = { workspace = true }
# TLS for the EmailAdapter's SMTP STARTTLS upgrade (iter-125). Used by the
# gateway to refuse plaintext SMTP AUTH and require an encrypted channel.
# The crypto provider must be EXPLICIT. `rustls` with default features
# enables `aws_lc_rs`, and `tokio-rustls` enables `ring` — so both are on,
# and `rustls::ClientConfig::builder()` PANICS when the crate features are
# ambiguous ("Could not automatically determine the process-level
# CryptoProvider from Rustls crate features"). That panic is in the Email
# adapter's TLS setup and in the proxy's TLS setup, so both were broken.
# One provider, named: `builder()` resolves it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
toml = { workspace = true }
serde_yaml = "0.9"

# Provider profiles + cross-provider fallback chain ([providers] section)
operant-config = { path = "../operant-config" }
operant-harness = { workspace = true }
# Doctor engine (§6 F2): provider-name validation + CLI tool discovery.
# Neither depends on operant-core, so no cycle.

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
bytes = { workspace = true }
regex = "1.10"
dirs = { workspace = true }
shell-words = "1.1.1"
base64 = "0.22"
kokoro-tiny = "0.1.0"
hound = "3.5"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.7", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
which = "6.0"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# OS-seeded CSPRNG for OAuth PKCE verifiers.
rand = { workspace = true }
# Chromium cookie v10 decryption (AES-128-CBC) — browser cookie import.
aes = "0.8.4"
cbc = "0.1.2"
constant_time_eq = "0.3"
flate2 = "1.0"
tar = "0.4"
tempfile = { workspace = true }
image = { workspace = true }

# Baked-in engines (not subprocess): memory-wire replaces agentmemory.
# sourcehound_mcp HELD OUT — see below.
#
# memory-wire tracks `main` — user-ordered persistent-latest. Every build
# (via scripts/build.sh, which scripts/check.sh and scripts/sync-vendors.sh
# delegate to; no throttle stamp since the 2026-10-14 batch, plan 11A)
# advances the lock to the branch HEAD when the network allows, so this tree
# always compiles the newest memory-wire source.
# The price is stated plainly: a floating branch means an upstream release can
# break this build with no commit here (it happened 2026-09-29, when a release
# required a newer `anyhow` than the lock held). That failure is loud, not
# silent — and the remedy is a pin. At release time, replace `branch =` with
# the locked `rev =` (see scripts/sync-vendors.sh output) and re-verify.
memory-wire = { git = "https://github.com/ishan-parihar/memory-wire", branch = "main" }
# sourcehound_mcp = { package = "sourcehound", git = "https://github.com/ishan-parihar/sourcehound", branch = "master" }
# HELD (round 2): vendored obscura-render breaks against registry taffy 0.12.2
# (needs vendored 0.12.1 APIs) + cosmic-text feature-union divergence — 36 errors.
# See diagnosis before re-adding; fallback is subprocess over their MCP server.

[features]
default = []
anthropic = []

[build-dependencies]
cc = "1.0"

[dev-dependencies]
mockito = "1.4"
tracing-subscriber = { workspace = true }
serial_test = "3.2"
tempfile = { workspace = true }

[lints]
workspace = true
