[package]
name = "operant-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI for Operant: A high-performance ReAct agent framework"
readme = "README.md"

[[bin]]
name = "operant"
path = "src/main.rs"

[dependencies]
# Core library
operant-core = { path = "../operant-core", features = ["anthropic"] }

# Optional subsystem crates — feature-gated like zeroclaw
operant-channels = { workspace = true, optional = true }
operant-tools = { workspace = true, optional = true }
operant-runtime = { workspace = true, optional = true }
operant-gateway = { workspace = true, optional = true }
operant-plugins = { workspace = true, optional = true }
operant-hardware = { workspace = true, optional = true }
operant-memory = { workspace = true, optional = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
futures = { workspace = true }

# CLI
clap = { workspace = true, features = ["derive"] }
clap_complete = "4.5"

# Serialization
schemars = { workspace = true }
serde = { workspace = true }
base64 = "0.22"
serde_json = { workspace = true }
serde_yaml = "0.9"
toml = "0.8"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Terminal UI
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }

# Utilities
anyhow = { workspace = true }
dirs = "5.0"
console = "0.15"
chrono = { version = "0.4", features = ["serde"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }

# TUI dependencies from claurst
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
similar = "2.0"
icy_sixel = "0.4"
image = "0.25"
which = "6.0"
regex = "1.0"
parking_lot = "0.12"
dashmap = "6.0"
reqwest = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }

# HTTP server
axum = { workspace = true }
tower-http = { workspace = true }

# Browser opening
open = "5"

# SQLite (for WAL checkpoint in doctor --fix)
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = { workspace = true }

[features]
default = [
    "agent-runtime",
    "gateway",
]

# The full agent runtime — agent loop, channels, tools, all subsystems.
# Without this, you get the kernel: config + providers + memory + CLI chat.
agent-runtime = [
    "dep:operant-runtime",
    "dep:operant-channels",
    "dep:operant-tools",
    "channel-telegram",
    "channel-discord",
    "channel-slack",
    "channel-email",
    "channel-signal",
    "channel-mattermost",
    "channel-irc",
    "channel-imessage",
    "channel-dingtalk",
    "channel-qq",
    "channel-bluesky",
    "channel-twitter",
    "channel-reddit",
    "channel-notion",
    "channel-linq",
    "channel-wati",
    "channel-nextcloud",
    "channel-mochat",
    "channel-wecom",
    "channel-clawdtalk",
    "channel-webhook",
    "channel-acp-server",
    "channel-whatsapp-cloud",
]

# Major subsystems
gateway = ["dep:operant-gateway"]

# Channels — each forwards directly to operant-channels (1 hop)
channel-telegram = ["operant-channels/channel-telegram"]
channel-discord = ["operant-channels/channel-discord"]
channel-slack = ["operant-channels/channel-slack"]
channel-email = ["operant-channels/channel-email"]
channel-signal = ["operant-channels/channel-signal"]
channel-mattermost = ["operant-channels/channel-mattermost"]
channel-irc = ["operant-channels/channel-irc"]
channel-imessage = ["operant-channels/channel-imessage"]
channel-dingtalk = ["operant-channels/channel-dingtalk"]
channel-qq = ["operant-channels/channel-qq"]
channel-bluesky = ["operant-channels/channel-bluesky"]
channel-twitter = ["operant-channels/channel-twitter"]
channel-reddit = ["operant-channels/channel-reddit"]
channel-notion = ["operant-channels/channel-notion"]
channel-linq = ["operant-channels/channel-linq"]
channel-wati = ["operant-channels/channel-wati"]
channel-nextcloud = ["operant-channels/channel-nextcloud"]
channel-mochat = ["operant-channels/channel-mochat"]
channel-wecom = ["operant-channels/channel-wecom"]
channel-clawdtalk = ["operant-channels/channel-clawdtalk"]
channel-webhook = ["operant-channels/channel-webhook"]
channel-acp-server = ["operant-channels/channel-acp-server"]
channel-whatsapp-cloud = ["operant-channels/channel-whatsapp-cloud"]
channel-mqtt = ["operant-channels/channel-mqtt"]

# Backends and platform flags
hardware = ["dep:operant-hardware", "operant-hardware/hardware"]
browser-native = ["operant-tools/browser-native"]
plugins-wasm = ["dep:operant-plugins"]
memory-postgres = ["operant-memory/memory-postgres"]
rag-pdf = ["operant-tools/rag-pdf"]
tdg = ["operant-core/tdg"]

# CI meta-feature
ci-all = [
    "agent-runtime", "hardware",
    "browser-native", "plugins-wasm", "memory-postgres", "rag-pdf",
]

[dev-dependencies]
