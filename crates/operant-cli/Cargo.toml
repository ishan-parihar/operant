[package]
name = "operant-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI for Operant: A high-performance ReAct agent framework"
readme = "README.md"

[[bin]]
name = "operant"
path = "src/main.rs"

[dependencies]
# Core library
operant-core = { path = "../operant-core" }
operant-harness = { workspace = true }

# Optional subsystem crates — feature-gated like operant
# operant-channels is a feature carrier: this crate never names it, but the
# gateway (its only consumer) does, so the channel-* features below have to
# reach it. `default-features = false` keeps operant-channels' own 21-channel
# default set from re-enabling everything behind the caller's back — that is
# what made every channel flag below decorative. Path rather than
# `workspace = true` because a member may not disable the workspace entry's
# default features.
operant-channels = { path = "../operant-channels", optional = true, default-features = false }
operant-tools = { workspace = true, optional = true }
operant-runtime = { workspace = true, optional = true }
operant-gateway = { workspace = true, optional = true }
operant-plugins = { workspace = true, optional = true }
operant-hardware = { workspace = true, optional = true }
operant-memory = { workspace = true, optional = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
futures = { workspace = true }

# CLI
clap = { workspace = true, features = ["derive"] }
clap_complete = "4.5"

# Serialization
schemars = { workspace = true }
serde = { workspace = true }
base64 = "0.22"
serde_json = { workspace = true }
serde_yaml = "0.9"
toml = "0.8"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Terminal UI
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }

# Utilities
anyhow = { workspace = true }
dirs = "5.0"
console = "0.15"
chrono = { version = "0.4", features = ["serde"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }

# TUI dependencies
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
# Streaming CommonMark event parser for the transcript markdown renderer.
# Event-based (not AST/HTML) so events map 1:1 onto ratatui Line/Span.
pulldown-cmark = { version = "0.13", default-features = false }
# Grapheme-cluster width measurement, so the renderer's wrapping and
# truncation never split a combining mark or ZWJ sequence.
unicode-segmentation = "1"
similar = "2.0"
icy_sixel = "0.4"
image = "0.25"
which = "6.0"
regex = "1.0"
parking_lot = "0.12"
dashmap = "6.0"
# Only for `signal(SIGPIPE, SIG_DFL)` at startup. Already in the dependency
# tree transitively; direct so the binary does not die with a core dump when
# its output is piped into `head`. See `restore_default_sigpipe_disposition`.
libc = "0.2"
reqwest = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }

# HTTP server
axum = { workspace = true }
tower-http = { workspace = true }

# Browser opening
open = "5"

# SQLite (for WAL checkpoint in doctor --fix)
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = { workspace = true }

[features]
default = [
    "agent-runtime",
    "gateway",
]

# The full agent runtime — agent loop, channels, tools, all subsystems.
# Without this, you get the kernel: config + providers + memory + CLI chat.
agent-runtime = [
    "dep:operant-runtime",
    "dep:operant-channels",
    "dep:operant-tools",
    "channel-telegram",
    "channel-discord",
    "channel-slack",
    "channel-email",
    "channel-signal",
    "channel-mattermost",
    "channel-irc",
    "channel-imessage",
    "channel-dingtalk",
    "channel-qq",
    "channel-bluesky",
    "channel-twitter",
    "channel-reddit",
    "channel-notion",
    "channel-linq",
    "channel-wati",
    "channel-nextcloud",
    "channel-mochat",
    "channel-wecom",
    "channel-clawdtalk",
    "channel-webhook",
    "channel-acp-server",
    "channel-whatsapp-cloud",
]

# Major subsystems
# No channel flags here on purpose: the channel-* features below already
# forward to operant-gateway, and re-listing them would pin a second copy of
# the same selection that nothing could switch off.
gateway = ["dep:operant-gateway"]

# Channels — each forwards to BOTH consumers: operant-channels (which compiles
# the channel) and operant-gateway (which wires it into the gateway). The `?`
# on the gateway hop keeps operant-gateway optional: the flag is passed only
# when the `gateway` feature already pulled the crate in, and is a no-op when
# it did not. Forwarding to operant-channels alone left operant-gateway's own
# channel-* features dead, so the whole set was unselectable.
channel-telegram = ["operant-channels/channel-telegram", "operant-gateway?/channel-telegram"]
channel-discord = ["operant-channels/channel-discord", "operant-gateway?/channel-discord"]
channel-slack = ["operant-channels/channel-slack", "operant-gateway?/channel-slack"]
channel-email = ["operant-channels/channel-email", "operant-gateway?/channel-email"]
channel-signal = ["operant-channels/channel-signal", "operant-gateway?/channel-signal"]
channel-mattermost = ["operant-channels/channel-mattermost", "operant-gateway?/channel-mattermost"]
channel-irc = ["operant-channels/channel-irc", "operant-gateway?/channel-irc"]
channel-imessage = ["operant-channels/channel-imessage", "operant-gateway?/channel-imessage"]
channel-dingtalk = ["operant-channels/channel-dingtalk", "operant-gateway?/channel-dingtalk"]
channel-qq = ["operant-channels/channel-qq", "operant-gateway?/channel-qq"]
channel-bluesky = ["operant-channels/channel-bluesky", "operant-gateway?/channel-bluesky"]
channel-twitter = ["operant-channels/channel-twitter", "operant-gateway?/channel-twitter"]
channel-reddit = ["operant-channels/channel-reddit", "operant-gateway?/channel-reddit"]
channel-notion = ["operant-channels/channel-notion", "operant-gateway?/channel-notion"]
channel-linq = ["operant-channels/channel-linq", "operant-gateway?/channel-linq"]
channel-wati = ["operant-channels/channel-wati", "operant-gateway?/channel-wati"]
channel-nextcloud = ["operant-channels/channel-nextcloud", "operant-gateway?/channel-nextcloud"]
channel-mochat = ["operant-channels/channel-mochat", "operant-gateway?/channel-mochat"]
channel-wecom = ["operant-channels/channel-wecom", "operant-gateway?/channel-wecom"]
channel-clawdtalk = ["operant-channels/channel-clawdtalk", "operant-gateway?/channel-clawdtalk"]
channel-webhook = ["operant-channels/channel-webhook", "operant-gateway?/channel-webhook"]
channel-acp-server = ["operant-channels/channel-acp-server", "operant-gateway?/channel-acp-server"]
channel-whatsapp-cloud = ["operant-channels/channel-whatsapp-cloud", "operant-gateway?/channel-whatsapp-cloud"]
channel-mqtt = ["operant-channels/channel-mqtt", "operant-gateway?/channel-mqtt"]

# Backends and platform flags
hardware = ["dep:operant-hardware", "operant-hardware/hardware"]
browser-native = ["operant-tools/browser-native"]
plugins-wasm = ["dep:operant-plugins"]
memory-postgres = ["operant-memory/memory-postgres"]
rag-pdf = ["operant-tools/rag-pdf"]
anthropic = ["operant-core/anthropic"]  # cfg-gate for AnthropicModelClient import in main.rs

# CI meta-feature
ci-all = [
    "agent-runtime", "hardware",
    "browser-native", "plugins-wasm", "memory-postgres", "rag-pdf",
]

[dev-dependencies]

[lints]
workspace = true
