[package]
name = "operant-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI for Operant: A high-performance ReAct agent framework"
readme = "README.md"

[[bin]]
name = "operant"
path = "src/main.rs"

[dependencies]
# Core library
operant-core = { path = "../operant-core" }
operant-harness = { workspace = true }
operant-os = { workspace = true }

# Optional subsystem crates — feature-gated like operant
operant-tools = { workspace = true, optional = true }
operant-plugins = { workspace = true, optional = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
futures = { workspace = true }

# CLI
clap = { workspace = true, features = ["derive"] }
clap_complete = "4.5"

# Serialization
schemars = { workspace = true }
serde = { workspace = true }
base64 = "0.22"
serde_json = { workspace = true }
serde_yaml = "0.9"
toml = "0.8"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Terminal UI
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }

# Utilities
anyhow = { workspace = true }
dirs = "5.0"
console = "0.15"
chrono = { version = "0.4", features = ["serde"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }

# TUI dependencies
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
# Streaming CommonMark event parser for the transcript markdown renderer.
# Event-based (not AST/HTML) so events map 1:1 onto ratatui Line/Span.
pulldown-cmark = { version = "0.13", default-features = false }
# Grapheme-cluster width measurement, so the renderer's wrapping and
# truncation never split a combining mark or ZWJ sequence.
unicode-segmentation = "1"
similar = "2.0"
icy_sixel = "0.4"
image = { workspace = true }
which = "6.0"
regex = "1.0"
parking_lot = "0.12"
dashmap = "6.0"
# Only for `signal(SIGPIPE, SIG_DFL)` at startup. Already in the dependency
# tree transitively; direct so the binary does not die with a core dump when
# its output is piped into `head`. See `restore_default_sigpipe_disposition`.
libc = "0.2"
reqwest = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }

# HTTP server
axum = { workspace = true }
tower-http = { workspace = true }

# Browser opening
open = "5"

# SQLite (for WAL checkpoint in doctor --fix)
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = { workspace = true }

[features]
default = [
    "agent-runtime",
]

# The full agent runtime — agent loop, channels, tools, all subsystems.
# Without this, you get the kernel: config + providers + memory + CLI chat.
agent-runtime = [
    "dep:operant-tools",
]

# Major subsystems
#
# `browser-native` and `rag-pdf` are GONE (RT-88): both enabled a
# dependency in `operant-tools` for a code path nothing reached —
# `fantoccini` and `lopdf` — and `rag-pdf` was in the DEFAULT feature
# list, so the cost was real. The `pdf_read` tool it advertised was
# registered nowhere, so the feature delivered a capability the agent
# could never call. A PDF reader, if it is wanted, belongs in
# `operant-core/src/tools/`, where the tool trait and the path policy are
# the ones the product uses.
plugins-wasm = ["dep:operant-plugins"]
anthropic = ["operant-core/anthropic"]  # cfg-gate for AnthropicModelClient import in main.rs

# The `memory-postgres` feature and the `ci-all` meta-feature are GONE
# (RT-92). `ci-all` was referenced by NO workflow and NO script — the
# GitHub Actions quota is exhausted, so there is no CI to run it — and
# `memory-postgres` only reached `operant-memory`, a crate the CLI
# references ZERO times. The `postgres` dependency was compiled for a
# feature nobody asked for, in a crate nothing called.

[dev-dependencies]
serial_test = "3.2"

[lints]
workspace = true
