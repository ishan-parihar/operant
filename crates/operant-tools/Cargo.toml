[package]
name = "operant-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tool implementations for agent-callable capabilities."
publish = false

[dependencies]
operant-api.workspace = true
operant-config.workspace = true
operant-providers.workspace = true
operant-memory.workspace = true
operant-infra.workspace = true
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { workspace = true }
directories = { workspace = true }
futures-util = { workspace = true }
glob = "0.3"
hex = { workspace = true }
nanohtml2text = "0.2"
parking_lot = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = "2.0"
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["fs", "sync"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
urlencoding = "2.1"
uuid = { workspace = true }
which = "6.0"

# Optional deps for feature-gated modules
fantoccini = { version = "0.22.1", optional = true, default-features = false, features = ["rustls-tls"] }
pdf-extract = { version = "0.10", optional = true }

[features]
default = []
browser-native = ["dep:fantoccini"]
rag-pdf = ["dep:pdf-extract"]

# NOTE: the `probe` feature (probe-rs SWD/JTAG support for hardware tools)
# was removed 2026-08-02 — it referenced the `probe_rs` crate but the
# dependency was never declared, so the feature had never compiled under
# `--all-features`. Wire it back up as a follow-up task: add
# `probe-rs = { version = "0.2x", optional = true }` and set
# `probe = ["dep:probe-rs"]` (see docs/RUST_BEST_PRACTICES_PLAN.md).

[dev-dependencies]
operant-infra.workspace = true
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-test = "0.4"
wiremock = "0.6"
scopeguard = "1.2"
