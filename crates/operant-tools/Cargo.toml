[package]
name = "operant-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI discovery for the doctor check."
publish = false

# This crate held ~70 tool modules (30 860 lines) and the product called
# ONE of them: `cli_discovery::discover_cli_tools`, from
# `operant-core/src/doctor.rs`. The rest were a PARALLEL implementation of
# the tools the core actually registers — the core carries its own
# `browser_tool.rs`, `file_tools.rs`, `http_tool.rs` and `web_search_tool.rs`
# — and they were kept in step by hand, which is exactly the divergence that
# cost the Streamable-HTTP fix its reference implementation (RT-81).
#
# The `browser-native` and `rag-pdf` features went with them: they compiled
# `fantoccini` and `lopdf` for code paths nothing reached, and `rag-pdf` is
# in `operant-cli`'s DEFAULT feature list, so the cost was real. `pdf_read`
# was a 693-line module whose tool was registered NOWHERE — the feature
# advertised a capability the agent could never call.
#
# See RT-88 in docs/audit/2026-06-19-BUGS.md.

[dependencies]
serde = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
