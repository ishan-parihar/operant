<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Dashboard</title>
<style>
  :root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-card: #1c2333;
    --bg-hover: #252d3f;
    --border: #30363d;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #6e7681;
    --accent-blue: #58a6ff;
    --accent-green: #3fb950;
    --accent-orange: #d29922;
    --accent-red: #f85149;
    --accent-purple: #bc8cff;
    --accent-cyan: #39d2c0;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.4);
    --radius: 8px;
    --radius-sm: 6px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
  }

  .app-header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .app-header h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .app-header h1 .logo {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
  }

  .header-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .status-dot.online { background: var(--accent-green); box-shadow: 0 0 6px rgba(63,185,80,0.4); }
  .status-dot.offline { background: var(--accent-red); box-shadow: 0 0 6px rgba(248,81,73,0.4); }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
  }

  /* ── Metric Cards ── */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .metric-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .metric-card:hover {
    border-color: var(--accent-blue);
    box-shadow: var(--shadow);
  }

  .metric-label {
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .metric-value {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }

  .metric-value.green { color: var(--accent-green); }
  .metric-value.blue { color: var(--accent-blue); }
  .metric-value.orange { color: var(--accent-orange); }
  .metric-value.red { color: var(--accent-red); }
  .metric-value.purple { color: var(--accent-purple); }
  .metric-value.cyan { color: var(--accent-cyan); }

  .metric-sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  /* ── Section Headers ── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .section-header h2 {
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-header .badge {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--bg-hover);
    color: var(--text-secondary);
  }

  /* ── Kanban Board ── */
  .board-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .board-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .board-header h3 {
    font-size: 15px;
    font-weight: 600;
  }

  .board-header .total-badge {
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 10px;
    background: var(--bg-hover);
    color: var(--text-secondary);
  }

  .status-lanes {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
    padding: 20px;
  }

  .lane {
    text-align: center;
  }

  .lane-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .lane-count {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }

  .lane-count.triage { color: var(--text-muted); }
  .lane-count.todo { color: var(--accent-blue); }
  .lane-count.ready { color: var(--accent-cyan); }
  .lane-count.running { color: var(--accent-orange); }
  .lane-count.blocked { color: var(--accent-red); }
  .lane-count.done { color: var(--accent-green); }
  .lane-count.archived { color: var(--text-muted); opacity: 0.6; }

  /* ── Config Table ── */
  .config-section {
    margin-top: 24px;
  }

  .config-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .config-table th {
    text-align: left;
    padding: 10px 16px;
    font-weight: 600;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .config-table td {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text-primary);
  }

  .config-table tr:last-child td { border-bottom: none; }

  .config-table .key {
    color: var(--text-muted);
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    font-size: 12px;
  }

  .config-table .value {
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    font-size: 12px;
  }

  /* ── Last Updated ── */
  .footer-info {
    margin-top: 24px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    padding: 16px;
    border-top: 1px solid var(--border);
  }

  /* ── Loading ── */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    color: var(--text-muted);
    font-size: 14px;
    gap: 8px;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent-blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Error State ── */
  .error-state {
    padding: 16px 20px;
    color: var(--accent-red);
    font-size: 13px;
    background: rgba(248,81,73,0.08);
    border: 1px solid rgba(248,81,73,0.2);
    border-radius: var(--radius-sm);
    display: none;
  }

  .error-state.visible { display: block; }

  @media (max-width: 640px) {
    .container { padding: 16px; }
    .metrics-grid { grid-template-columns: 1fr; }
    .status-lanes { grid-template-columns: repeat(3, 1fr); }
    .app-header { padding: 12px 16px; }
    .app-header h1 { font-size: 17px; }
  }
</style>
</head>
<body>

<div class="app-header">
  <h1><span class="logo">H</span> Hermes Dashboard</h1>
  <div class="header-status">
    <span class="status-dot offline" id="statusDot"></span>
    <span id="statusText">Connecting...</span>
  </div>
</div>

<div class="container">
  <!-- Metric Cards -->
  <div class="metrics-grid" id="metricsGrid">
    <div class="metric-card">
      <div class="metric-label">System Status</div>
      <div class="metric-value green" id="sysStatus">---</div>
      <div class="metric-sub" id="sysDetail">Waiting for data...</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Uptime</div>
      <div class="metric-value blue" id="uptimeValue">--:--:--</div>
      <div class="metric-sub" id="uptimeDetail">since last restart</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Gateway</div>
      <div class="metric-value" id="gatewayValue">---</div>
      <div class="metric-sub" id="gatewayDetail">---</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Kanban Tasks</div>
      <div class="metric-value purple" id="kanbanValue">---</div>
      <div class="metric-sub" id="kanbanDetail">across all boards</div>
    </div>
  </div>

  <!-- Error State -->
  <div class="error-state" id="errorState"></div>

  <!-- Kanban Board -->
  <div class="section-header">
    <h2>Kanban Board <span class="badge" id="boardBadge">default</span></h2>
    <span style="font-size:12px;color:var(--text-muted);">Task distribution by status</span>
  </div>
  <div class="board-card" id="boardCard">
    <div class="loading"><div class="spinner"></div> Loading board data...</div>
  </div>

  <!-- Configuration -->
  <div class="config-section section-header">
    <h2>Configuration</h2>
  </div>
  <table class="config-table">
    <thead>
      <tr><th>Key</th><th>Value</th></tr>
    </thead>
    <tbody id="configBody">
      <tr><td colspan="2" style="text-align:center;color:var(--text-muted);">Loading...</td></tr>
    </tbody>
  </table>

  <div class="footer-info">
    <span id="lastUpdated">Last updated: --</span>
    &middot;
    <span id="pollCount">Poll #0</span>
  </div>
</div>

<script>
'use strict';

const POLL_INTERVAL_MS = 3000;
let pollCount = 0;
let startTime = null;

function fmtUptime(secs) {
  if (secs == null) return '--:--:--';
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function fmtDuration(secs) {
  if (secs == null) return '--';
  if (secs < 60) return `${secs}s`;
  if (secs < 3600) return `${Math.floor(secs / 60)}m ${secs % 60}s`;
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  return `${h}h ${m}m`;
}

function updateHeaderStatus(online, text) {
  const dot = document.getElementById('statusDot');
  const label = document.getElementById('statusText');
  dot.className = 'status-dot ' + (online ? 'online' : 'offline');
  label.textContent = text || (online ? 'Online' : 'Offline');
}

function updateMetrics(status) {
  const sysEl = document.getElementById('sysStatus');
  const sysDetail = document.getElementById('sysDetail');
  if (status.status === 'running') {
    sysEl.textContent = 'Running';
    sysEl.className = 'metric-value green';
    sysDetail.textContent = `v${status.version} | ${status.agent_model}`;
  } else {
    sysEl.textContent = 'Unknown';
    sysEl.className = 'metric-value red';
    sysDetail.textContent = 'Could not determine status';
  }

  if (startTime == null && status.uptime_seconds != null) {
    startTime = Date.now() - (status.uptime_seconds * 1000);
  }

  const uptimeEl = document.getElementById('uptimeValue');
  if (startTime) {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    uptimeEl.textContent = fmtUptime(elapsed);
  } else {
    uptimeEl.textContent = fmtUptime(status.uptime_seconds);
  }

  const gwEl = document.getElementById('gatewayValue');
  const gwDetail = document.getElementById('gatewayDetail');
  if (status.gateway_running) {
    gwEl.textContent = 'Active';
    gwEl.className = 'metric-value green';
    gwDetail.textContent = 'Gateway running';
  } else {
    gwEl.textContent = 'Inactive';
    gwEl.className = 'metric-value orange';
    gwDetail.textContent = 'Gateway not started';
  }

  const kbEl = document.getElementById('kanbanValue');
  document.getElementById('kanbanDetail').textContent =
    `${status.kanban_tasks} task${status.kanban_tasks !== 1 ? 's' : ''} across all boards`;
  kbEl.textContent = status.kanban_tasks;
}

function renderBoard(board) {
  const card = document.getElementById('boardCard');
  if (!board) {
    card.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">No board data available.</div>';
    return;
  }

  document.getElementById('boardBadge').textContent = board.slug || 'default';

  const lanes = [
    { key: 'triage', label: 'Triage', cls: 'triage' },
    { key: 'todo', label: 'Todo', cls: 'todo' },
    { key: 'ready', label: 'Ready', cls: 'ready' },
    { key: 'running', label: 'Running', cls: 'running' },
    { key: 'blocked', label: 'Blocked', cls: 'blocked' },
    { key: 'done', label: 'Done', cls: 'done' },
    { key: 'archived', label: 'Archived', cls: 'archived' },
  ];

  const tc = board.task_counts || {};
  const total = board.total || 0;

  card.innerHTML = `
    <div class="board-header">
      <h3>${board.name || board.slug || 'Board'}</h3>
      <span class="total-badge">${total} total</span>
    </div>
    <div class="status-lanes">
      ${lanes.map(l => `
        <div class="lane">
          <div class="lane-label">${l.label}</div>
          <div class="lane-count ${l.cls}">${tc[l.key] ?? 0}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function updateConfig(cfg) {
  const tbody = document.getElementById('configBody');
  if (!cfg) {
    tbody.innerHTML = '<tr><td colspan="2" style="text-align:center;color:var(--text-muted);">Unavailable</td></tr>';
    return;
  }

  const rows = [
    { key: 'model', value: cfg.model },
    { key: 'base_url', value: cfg.base_url },
    { key: 'platforms_enabled', value: (cfg.platforms_enabled || []).join(', ') || 'none' },
    { key: 'skills_dir', value: cfg.skills_dir },
    { key: 'database_path', value: cfg.database_path },
    { key: 'gateway_running', value: cfg.gateway_running ? 'yes' : 'no' },
  ];

  tbody.innerHTML = rows.map(r => `
    <tr>
      <td class="key">${r.key}</td>
      <td class="value">${r.value}</td>
    </tr>
  `).join('');
}

function updateHealth(health) {
  if (!health) return;
  const doc = document.getElementById('sysDetail');
  const parts = [];
  if (health.database_ok) parts.push('db: ok');
  else parts.push('db: err');
  if (health.kanban_ok) parts.push('kanban: ok');
  else parts.push('kanban: err');
  doc.textContent += ` | ${parts.join(', ')}`;
}

function showError(msg) {
  const el = document.getElementById('errorState');
  el.textContent = msg;
  el.classList.add('visible');
}

function hideError() {
  document.getElementById('errorState').classList.remove('visible');
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
  return res.json();
}

async function poll() {
  pollCount++;
  try {
    const [status, boards, cfg, health] = await Promise.all([
      fetchJSON('/api/status'),
      fetchJSON('/api/boards'),
      fetchJSON('/api/config'),
      fetchJSON('/api/health'),
    ]);

    hideError();
    updateHeaderStatus(true);
    updateMetrics(status);
    renderBoard(boards && boards.length > 0 ? boards[0] : null);
    updateConfig(cfg);
    updateHealth(health);

    document.getElementById('lastUpdated').textContent =
      `Last updated: ${new Date().toLocaleTimeString()}`;
    document.getElementById('pollCount').textContent = `Poll #${pollCount}`;
  } catch (err) {
    updateHeaderStatus(false, 'Disconnected');
    showError(`Connection error: ${err.message}. Retrying every ${POLL_INTERVAL_MS / 1000}s...`);
  }
}

// Start polling
poll();

// Live uptime counter
setInterval(() => {
  if (startTime) {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('uptimeValue').textContent = fmtUptime(elapsed);
  }
}, 1000);

// Full data poll
setInterval(poll, POLL_INTERVAL_MS);
</script>
</body>
</html>
