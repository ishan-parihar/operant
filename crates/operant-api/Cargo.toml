[package]
name = "operant-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Trait definitions and shared types for Operant — the API layer."
publish = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = "2.0"
tracing = { version = "0.1", default-features = false }
tokio = { version = "1.36", default-features = false, features = ["sync", "process", "macros", "rt"] }
tokio-util = { version = "0.7", default-features = false }

[dev-dependencies]
parking_lot = "0.12"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
