[package]
name = "operant-robot-kit"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Robotics toolkit for Operant — drive, look, listen, speak, sense, emote"

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
