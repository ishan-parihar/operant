# Hermes-RS configuration example

terminal_backend = "local"

# Config format version. `None` means legacy v0 (no version field); the app
# writes 2. You do not normally need to set this by hand.
# version = 2

# SQLite database location. Defaults to `~/.operant/database.db`.
# database_path = "~/.operant/database.db"

# Tool-approval allowlist (hermes `command_allowlist` parity). Patterns match
# tool names exactly or via `*`/`?` globs (e.g. "file_*"). A matching tool
# skips the permission prompt in every session. "Always allow" choices made
# interactively (TUI `p` key, gateway /approve always / button) are persisted
# to ~/.operant/approval_allowlist.json and honored across restarts.
# command_allowlist = ["file_read", "file_*"]

[client]
base_url = "https://api.openai.com/v1"
# api_key = "set me or use OPENAI_API_KEY"
timeout_secs = 60
max_context_length = 128000
# TTL for provider prompt-cache breakpoints: "5m" (default) or "1h".
# Applies to OpenRouter-compatible endpoints and the Anthropic adapter.
# prompt_cache_ttl = "5m"

[client.rate_limit]
# Maximum retries after a 429 or transient server error (0 = no retries)
max_retries = 3
# Base delay (seconds) for exponential backoff: delay = min(base × 2^attempt, max)
base_delay_secs = 5
# Maximum delay (seconds) cap for exponential backoff
max_delay_secs = 60
# Token-bucket capacity — max requests allowed in a short burst
bucket_capacity = 60
# Token refill rate (tokens per second)
bucket_refill_rate = 1.0

[agent]
model = "gpt-4"
max_iterations = 20
tool_timeout_secs = 30
request_timeout_secs = 120
stream = true
context_window = 128000
# Largest share of `context_window` that ONE tool result may occupy before its
# bulk is withheld behind an explicit marker (iter-357). The kept head, the
# token count, the per-token price and the number of tokens removed are all
# stated in the marker, because a silently shortened tool result is worse than
# a failed one: the model cannot tell it is not reading what the tool returned.
# 0.05 = 5%.
max_tool_result_share = 0.05
max_healing_attempts = 3
show_reasoning = true
tool_progress = "auto"
context_compression = false
# Same-provider model fallback (hermes `fallback_providers` parity, same
# client): when the primary model fails with a retryable error (5xx, 429,
# network), the agent retries each fallback model in order on the SAME client
# (provider/base URL/key). Cross-provider fallback lives in `[providers]`
# below. Both are wired through FallbackModelClient in the run path.
# fallback_models = ["gpt-4o-mini", "gpt-3.5-turbo"]
# fallback_on_errors = true
# Context engine used to assemble the per-call message list (hermes-lcm parity):
#   - "compact" (default): deterministic decay + lossy eviction when over budget
#   - "lcm": lossless SQLite DAG + fresh-tail (D0) assembly; older messages are
#     preserved verbatim and retrievable via lcm_recall. Opt-in — P0 ships the
#     DAG + tail; P1 adds day/week/month LLM rollups (docs/HERMES_LCM_INTEGRATION.md)
# context_engine = "compact"
# context_lcm_db = "~/.operant/lcm.db"
# context_lcm_tail_tokens = 12000
# P3 adaptive auto-recall: inject top DAG evidence for the current question.
# context_lcm_auto_recall = true
# context_lcm_auto_recall_limit = 3
# context_lcm_auto_recall_max_chars = 4000
# context_lcm_rollups_inject = true
# Background rollup maintenance every N minutes (0 = disabled, default).
# context_lcm_rollup_interval_minutes = 0
# Embedding model for lcm_vector_recall. Empty (default) = the tool is NOT
# registered — LCM works fully without any external embedding model (FTS
# recall, rollups and assertions are all local). Options:
#   * "local:hash"  — zero-dependency built-in embedder (no network calls)
#   * any model name — OpenAI-compatible /embeddings endpoint; REQUIRES the
#     provider to expose it. Prefer setting context_lcm_embedding_base_url
#     to a dedicated embeddings endpoint, otherwise the chat provider's base
#     URL and key are reused (warned at startup).
# context_lcm_embedding_model = "local:hash"
# Optional separate embeddings endpoint (e.g. local Ollama). Empty = reuse
# the chat provider's base URL and key.
# context_lcm_embedding_base_url = "http://localhost:11434/v1"
# LLM-driven assertion extraction (hermes ModelAssertionExtractor parity,
# opt-in): when true, `lcm_assert action=extract` mines durable facts from
# recent DAG nodes and persists them to the assertion store. Off by default
# (costs one LLM call per extract).
# context_lcm_assertion_extraction = true
# hermes-lcm session controls (ignore_session_patterns / read_only parity):
#   ignore patterns — globs of sessions skipped in GLOBAL recall (FTS,
#   vector, recent); explicit per-session recall is unaffected. Use to stop
#   noisy/benchmark sessions from leaking into the active context.
# context_lcm_ignore_session_patterns = ["noisy-*", "bench/*"]
#   read-only sessions — ids whose DAG is never mutated (ingest is a no-op),
#   keeping archived transcripts byte-for-byte stable.
# context_lcm_readonly_sessions = ["archive-2024"]
session_reset = "never"
# system_prompt = "You are Hermes."
# Fallback models tried in order when the primary model fails (rate-limited, unavailable, etc.)
# Each entry supports: model (required), provider, base_url, api_key, reasoning, max_retries
# fallbacks = [
#   { model = "gpt-4o-mini" },
#   { model = "gpt-3.5-turbo", max_retries = 2 },
# ]
# Turns between self-improvement memory reviews (0 = disabled, default 10)
memory_nudge_interval = 10
# Iterations between self-improvement skill nudges (0 = disabled, default 10)
creation_nudge_interval = 10

[autonomous]
interval_secs = 300
todo_path = "TODO.md"
status_path = "autonomous-status.toml"
test_command = "cargo test --workspace"
git_remote = "origin"
git_branch = "agent-dev"
commit_message = "Auto-commit by operant-rs"
command_timeout_secs = 900
max_failures_per_state = 3

[logging]
level = "info"
format = "pretty"
with_target = false
with_thread_ids = false
with_file = false
with_line_number = false

[tui]
theme = "opencode"
rich_output = true
show_tool_calls = true
show_iterations = true
landing_title = "HERMES"
prompt_placeholder = "Ask anything... \"Fix a TODO in the codebase\""
refresh_rate_ms = 80
compact_width = 96
medium_width = 120

[mcp]
autoload = true
# Master switch for progressive tool disclosure: when false, MCP tool
# schemas are always loaded eagerly and tools.tool_search.enabled is
# forced to "off" (default true).
deferred_loading = true
# Stdio MCP watchdog sweep interval in seconds (hermes
# mcp_stdio_watchdog.py parity): a background task periodically checks
# every connected stdio MCP server's child process and auto-reconnects
# one that has exited (crash), re-syncing its tools. 0 disables.
watchdog_interval_secs = 30

[[mcp.servers]]
name = "filesystem-demo"
transport = "http"
url = "http://127.0.0.1:8080/mcp"
# auth_token = "optional"
enabled = false

# Mixture-of-Agents (MoA) turns — hermes /moa parity (G5).
# When enabled, `operant run --moa` fans out `references` (advisory models)
# over the conversation, an `aggregator` synthesizes their advice, and the
# guidance is injected into the agent's context for that turn. Off by
# default: MoA costs N+1 LLM calls per turn.
[moa]
enabled = false
# references = [
#   { provider = "openai", model = "gpt-4o-mini", base_url = "https://api.openai.com/v1", api_key = "..." },
#   { provider = "deepseek", model = "deepseek-chat", base_url = "https://api.deepseek.com/v1", api_key = "..." },
# ]
# aggregator = { provider = "openai", model = "gpt-4o", base_url = "https://api.openai.com/v1", api_key = "..." }
# max_tokens = 1024        # per-reference output cap (aggregator is never capped)
# temperature = 0.7
# timeout_secs = 60

[[mcp.servers]]
name = "stdio-demo"
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "."]
enabled = false
# deferred = true   # skip the eager autoload connect at startup; connect on
#                   # demand via `operant mcp` (the injected agentmemory server
#                   # is deferred by default)
[mcp.servers.env]
# EXAMPLE_ROOT = "C:/workspace"

# ── Channels crate (rich `Channel` trait stack; used by `operant channel send`,
#    the daemon's supervised channels, and the ACP gateway) ──────────────
# The thin `[gateway]` platform adapters above are what `operant gateway run`
# uses; the channels crate adds approvals, draft streaming, ack reactions, and
# per-DM forum topics.
# [channels.telegram]
# enabled = false
# bot_token = ""
# allowed_users = []
# dm_topics_enabled = false   # per-DM forum topics (hermes parity)
# dm_topic_name = "General"
# disable_link_previews = false   # disable Telegram link previews on sends
# typing_cooldown_seconds = 30.0  # typing-indicator cooldown after transient failures
# fallback_ips = []               # pin the Bot API host to these IPs when DNS is
#                                 # broken (rotated round-robin; hermes parity)
#
# [channels.discord]
# enabled = false
# bot_token = ""
# allowed_users = []

[skills]
root_dir = "$HOME/.operant/skills"
memory_dir = "$HOME/.operant/memory"
autoload = true
template_name = "new-skill"
template_description = "Describe what this skill does."

[gateway]
telegram_enabled = false
# telegram_token = ""
telegram_api_base = "https://api.telegram.org"
# Per-DM forum topics: when true, each private chat gets its own topic
# (created via createForumTopic, thread id persisted across restarts) and
# replies are routed into it. Hermes `_setup_dm_topics` parity.
telegram_dm_topics_enabled = false
discord_enabled = false
# discord_token = ""
discord_api_base = "https://discord.com/api/v10"
slack_enabled = false
# slack_token = ""
slack_api_base = "https://slack.com/api"
whatsapp_enabled = false
# whatsapp_token = ""
email_enabled = false
# email_smtp_host = "smtp.gmail.com"
# email_smtp_user = ""
# email_smtp_pass = ""
sms_twilio_enabled = false
webhooks_enabled = false
# webhooks_addr = "127.0.0.1:8080"
admins = []
# Cap on concurrent gateway sessions (hermes max_concurrent_sessions parity).
# When reached, new sessions get a refusal reply while existing holders keep
# their slots. Unset/None = unlimited.
# max_concurrent_sessions = 4

# Global emergency stop — `operant pause` / `operant resume` writes/removes a
# sentinel (fail-safe: any file pauses new work). While paused, the cron
# scheduler skips dispatch, kanban dispatch is blocked, and new gateway turns
# get a paused reply. In-flight work is never killed.
# Suggested automations: `operant suggestions list|accept|dismiss|catalog|clear`

[tools]
registry_timeout_secs = 30
event_channel_size = 100
# disabled_tools = ["spotify_playback", "homeassistant"]
# disabled_toolsets = ["messaging", "media", "smart_home"]
# AFT (Agent File Tools) IDE-grade coding tools: 18 aft_* tools backed by
# an aft subprocess (tree-sitter outline/zoom/search, AST edit/patch,
# undo/checkpoints). Auto-downloaded from GitHub releases when not installed.
# The native file/terminal tools are only disabled when the bridge is proven
# live, so a missing/broken aft always falls back to the built-in tools.
aft_enabled = true
# Web tools (web_search, web_scrape, web_extract) via the sourcehound MCP
# server. Requires the `sourcehound` binary (SOURCEHOUND_BINARY override or PATH).
# Search provider preference lives in [web_tools] preferred_provider.
# Progressive tool disclosure (hermes `tools.tool_search` parity).
# When active, MCP server tools (`mcp_*`) are replaced in the model-visible
# tools array by a `tool_search` / `tool_describe` / `tool_call` bridge and
# surfaced on demand — keeping the context window lean when many MCP tools
# are connected. Native tools never defer; Tier 0 (no MCP tools) is a pure
# passthrough.
[tools.tool_search]
# "auto" (bridge on when MCP tools are present) | "on" | "off"
enabled = "auto"
# Listing budget as % of the model's context window (default 5.0).
threshold_pct = 5.0
# "auto" (skills-style listing when it fits) | "on" | "off"
listing = "auto"
# Absolute cap on the embedded catalog listing, in tokens (default 4000).
# listing_max_tokens = 4000

[tools.web]
search_url = "https://lite.duckduckgo.com/lite/?q={query}"
search_timeout_secs = 15
fetch_timeout_secs = 30
user_agent = "Mozilla/5.0 (compatible; HermesAgent/0.1)"
default_results = 10
max_results = 20
# preferred_provider: sourcehound (default — uses `sourcehound` binary, falls back to duckduckgo) | tavily | exa | searxng | duckduckgo
preferred_provider = "sourcehound"

[tools.http]
timeout_secs = 30

[tools.terminal]
max_timeout_secs = 300
max_output_bytes = 1000000

[tools.code_execution]
default_timeout_secs = 60
max_timeout_secs = 300

[harness]
# Unified harness — single store for tool/pool/wasm/hook + prompt/subagent.
# 018-U3: this is the single master switch. [tools.kernel].enabled is an alias
# for this for one release (OR), then removed. Set enabled=true to adopt.
enabled = false
# architecture_toml = "~/.operant/architecture.toml"
# max_active_providers = 64
# watch_wasm: hot-swap verified WASM plugin providers into the running kernel
# (default off — a permanent background poller whose every detected change
# re-instantiates the module, so it must be an explicit opt-in). Requires
# the `plugins-wasm` build feature AND [plugins].trusted_publisher_keys
# below: the swap path always verifies signatures in Strict mode, and an
# empty key set would mark every plugin Untrusted and silently never swap.
# watch_wasm = false

[plugins]
# Directories scanned for plugin manifests.
# plugin_dirs = ["~/.operant/plugins"]
# Signature enforcement for plugin code: "disabled" (default), "permissive",
# or "strict". Read by BOTH the tool bridge and the kernel WASM swap watcher,
# so the two can never disagree about whether code is verified. Note this is
# the AppConfig key, distinct from the schema layer's [plugins.security] of
# the same name.
# signature_mode = "disabled"
# Hex-encoded Ed25519 public keys of trusted plugin publishers. Required by
# strict mode, and mandatory for [harness] watch_wasm (the swap path always
# verifies and refuses to start without a non-empty key list).
# trusted_publisher_keys = []

[tools.kernel]
# Persistent kernel — session-persistent Python execution and learned state.
# 018-U3: [tools.kernel].enabled is now an alias for [harness].enabled (OR).
# Provision once: git submodule update --init --recursive
# Then set enabled = true (either here or in [harness]) to adopt. All tools default to read-only.
enabled = false
# python = "/usr/bin/python3.11"  # auto-detected if omitted
# state_dir = "~/.local/share/operant/kernel/harness"
sidecar_idle_secs = 1800
request_timeout_secs = 120
max_output_bytes = 200000
# route_python_to_kernel = false  # deprecated since 017-A: `enabled` is the sole gate now; this flag is ignored
harness_auto_learn = false      # when true, background review may emit kernel_state lessons
# Tool bridge — allow kernel cells to call operant tools in a loop
# [tools.kernel.tool_bridge]
# enabled = false
# allowlist = ["file_list", "file_read", "web_search"]
# max_calls_per_exec = 64
# per_call_timeout_secs = 60
# Session GC — prune stale per-session harness dirs
# session_gc_ttl_hours = 168  # 7 days
# Executable skills — SKILL.toml [reference] binding (plan 016, phase 6b)
# [tools.kernel.pyskill]
# enabled = false               # master switch for [reference] loading
# allowed_imports = []          # glob allowlist, e.g. ["my_pkg.*", "pdf_tools"]
#                               # empty = every reference denied (deny-by-default)

[tools.stt]
# groq_api_key = "..."
# openai_api_key = "..."
groq_model = "whisper-large-v3-turbo"
openai_model = "whisper-1"

[tts]
# provider: kokoro (default, local) | edge | elevenlabs | openai | minimax | mistral | gemini | xai | neutts | piper
provider = "kokoro"
# voice = "af_sky"   # provider-specific voice id
enabled = false

[memory]
# provider: agentmemory (default) | builtin
# - agentmemory: hybrid semantic memory via the agentmemory server (BM25 + vector + graph).
#                Operant auto-spawns `npx @agentmemory/agentmemory` on :3111 when needed
#                and, when this provider is active, auto-registers the
#                `@agentmemory/mcp` server natively under [mcp.servers] so the
#                full 53-tool memory surface is available to every agent path
# agentmemory_version pins the npm package for every spawn (auto-spawn + MCP
# entries); default is the pinned 0.9.29. Never `@latest` — a cold boot must
# not fetch whatever npm serves and run it with your privileges.
# agentmemory_version = "0.9.29"
#                (CLI, gateway, runtime agent) — no manual MCP config needed.
#                Lifecycle parity with the hermes-agent memory plugin:
#                session/start on init, observe on sync_turn, session/end on
#                exit, context on pre-compress, remember-mirror on memory writes.
# provider: memory-wire (default) | builtin
# - memory-wire: in-process memory-wire engine (retain/recall); replaces agentmemory
# - builtin:     file-backed MEMORY.md / USER.md in the operant home directory
provider = "memory-wire"
enabled = true

[browser]
# provider: sourcehound (default) | camofox | browserbase | browser-use | firecrawl
# - sourcehound:  sourcehound browser engine over MCP; sourcehound owns the engine,
#                 its profile cookie jar, and the DevTools endpoint operant attaches to
# - camofox:     local anti-detection browser REST API (CAMOFOX_URL)
# - browserbase: cloud (BROWSERBASE_API_KEY + BROWSERBASE_PROJECT_ID)
# - browser-use: cloud AI agent (BROWSER_USE_API_KEY)
# - firecrawl:   scrape API (FIRECRAWL_API_KEY)
# NOTE: the code default is "sourcehound" (see BrowserSettings::default).
# Uncomment to override it explicitly.
# provider = "sourcehound"

# ── Advanced sections (uncomment to configure) ───────────────────────────────
# These are power-user features. Most users don't need them.
# See the documentation for details.

# [vision]
# provider = "openai"
# model = "gpt-4o"
# base_url = "https://api.openai.com/v1"
# api_key = "..."

# [credential_pool]
# enabled = false
# strategy = "fill_first"  # global default: fill_first|round_robin|random|least_used
# Per-provider strategies override the global default (hermes
# `credential_pool_strategies` parity). Keys are provider names as inferred
# from the model (e.g. opencode-zen, openai, anthropic). Unknown values fall
# back to fill_first, mirroring hermes `get_pool_strategy()`.
# strategies = { opencode-zen = "round_robin", openai = "least_used" }
#
# Pools are created PER PROVIDER on demand (hermes `load_pool(provider)`
# parity): the primary provider is seeded from `[client] api_key` +
# `additional_api_keys` + the provider's env var, and every
# `[providers.models.<name>]` profile below gets its OWN pool seeded from its
# `api_key`. Each provider rotates its own keys on 429/401/billing
# (benched by error class: 401 → 5m, 429 → 1h, sole-credential transient →
# 60s) before the cross-provider fallback chain is consulted — so free-tier
# usage with several API keys stays alive under rate-limit pressure.
# `client.additional_api_keys = ["sk-...", "sk-..."]` adds more keys to the
# primary provider's pool.

# [auxiliary_models]
# Optional auxiliary model configurations for MoA / side-LLM tasks.

# [providers]
# Named provider profiles + ordered cross-provider fallback chain (hermes
# `fallback_providers` parity). Used by the run path to build a
# ProviderRegistry: when the primary provider fails with an auth/billing
# error, the agent switches to the next profile in `fallback_chain` (anti-
# thrash cooldowns apply). Entries referencing an unknown profile key are
# skipped with a warning. Same-provider model swaps are configured with
# `agent.fallback_models` above.
#
# Each profile also becomes its own credential pool (hermes
# `load_pool(fb_provider)` parity): when the chain switches to it, that
# provider rotates its own keys under free-tier pressure instead of failing
# on the first 429.
#  # [providers.models.opencode-zen]
  # base_url = "https://zen.example/v1"
  # api_key = "..."
  # api_keys = ["sk-...", "sk-..."]   # extra keys for THIS provider's pool
  # model = "deepseek-v4-flash-free"
  # timeout_secs = 180
#
# [providers.models.gemini]
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
# api_key = "..."
# model = "gemini-2.5-flash"
#
# [[providers.fallback_chain]]
# provider = "opencode-zen"
# model = "deepseek-v4-flash-free"
#
# [[providers.fallback_chain]]
# provider = "gemini"
# model = "gemini-2.5-flash"

# [checkpoints]
# Filesystem checkpoints. When enabled, the agent snapshots working directories
# into an isolated shadow git store under `base_dir` before mutating
# operations, so no git state leaks into your project repository.
#
# This is ON by default (the `checkpoint` tool is registered for every agent).
# The values below are the built-in defaults.
# enabled = true
# base_dir = "~/.operant/checkpoints"
# max_snapshots = 20

# [pk]
# Prime Kernel sidecar. Dark-merged: `enabled` defaults to false and the
# sidecar is not spawned at all, so the `code_execution` tempfile path remains
# the only Python surface until you opt in. Requires a working
# `sidecar_script` and a built `vendor/prime-agent` submodule.
# enabled = false
# sidecar_script = "pk-sidecar/main.py"
# ndjson_socket = "~/.operant/run/pk.sock"
# exec_timeout_secs = 30

# [genome] — the permission-genome (per-seat policy) knobs.
# See docs/PERMISSION-SCOPING-PLAN.md §5 P2. Seats without a policy row are
# UNGOVERNED: byte-identical to the pre-genome behavior (dangerous tools
# prompt, safe tools run) — which is deliberately NOT `yolo`.
[genome]
# Default seat mode for operator-seated policy rows that do not name one.
# Consumed by the /grant command (P3, live since iter-598); the runtime
# default for a seat without a policy row stays ungoverned regardless of
# this value.
unrestricted_default = "yolo"
# D-2 (owner ruling 2026-10-08) — the posture an UNGOVERNED unattended (cron)
# run takes on a dangerous tool when no interactive approver can answer the
# prompt (no active channel). "yolo" (default) keeps the legacy auto-approve;
# any other seat mode (standard | scoped | lockdown) denies with an
# actionable reason; a typo'd value fails CLOSED. Governed seats are not
# affected — their policy row already clamps unattended runs. This knob,
# and only this knob, manages the unattended posture.
unattended_posture = "yolo"
# Days a department-head approval's grant stands (the HoD default is 7).
# 0 or negative = never-standing for non-CEO approvals: the grant is
# recorded already-lapsed, so the approval stays auditable while conferring
# nothing. CEO+ (org-lead) approvals mint standing grants regardless.
grant_ttl_days = 7
# Wave 3 — minutes a completed turn's rolling session summary remains a
# valid continuation entry point (restart / session reload inside the
# window begins from it); after the window the next session starts fresh.
# Owner spec range 15-30; default 30. The summary is rewritten (upserted)
# after EVERY completed turn: new roll = previous roll + this session's
# doings — rolling, never an aggregate of old rolls.
session_summary_ttl_minutes = 30
# Wave 4 — the org-wide default budget a seat runs under when no per-seat
# override row exists. cap = 0 (default) = ungoverned: no budget consulted.
# basis: "tokens" | "usd". window: "daily" | "weekly" | "monthly" (UTC).
# mode: "soft" = inject remaining-budget + warn past the cap and continue;
#        "hard" = refuse turns that start over the cap with a clear notice.
# Per-employee fine-tuning lives in the seat_budgets table (data), so one
# seat can be capped without a config edit + restart.
[genome.budget]
basis = "tokens"
window = "daily"
cap = 0.0
mode = "soft"
# The P3 queue-sweep switch (queued_cron_jobs_resolve_grants) was removed in
# iter-600 without ever gaining a consumer — pending escalations resolve
# only by a human verdict or the 60s interactive lapse. [genome] rejects
# unknown keys, so if you uncommented it, delete that line from your config.
# (The run consults the grant ledger every tick regardless.)
# DM/feed context injection (gap 5 phase 1) — the bounded, deduplicated,
# ranked context section injected ahead of a seat's prompt: its own
# previous cycles (self), premiere/chief-of-staff broadcasts (global),
# same-department peers (dept), and DMs (phase 2 platform reads). The
# quotas are per-aspect character budgets; the total is a hard ceiling.
# Set enabled = false for byte-identical prompts.
[context_injection]
enabled = true
total_char_cap = 2000
dm_quota = 800
feed_quota = 500
global_quota = 500
dept_quota = 400
self_quota = 300
# Feed seat routing (plan-2026-10-09 §3): platform chat id -> seat whose
# feed it is. Unmapped chats default to "premiere".
# feed_seat_map = { "-1001234567890" = "premiere" }
recency_halflife_hours_feed = 24.0
recency_halflife_hours_dm = 168.0
weight_recency = 1.0
weight_lexical = 1.0
weight_authority = 0.5
# Daily seat-pairing sessions (gap 6, plan-2026-10-08-socialization-
# sessions.md). Pairs are DATA and ordered [senior, junior] — the senior
# seat initiates; junior voice is an explicit grant. Each pair holds one
# shared-budget conversation per schedule fire; the close-out lands in
# both seats' MEMORY.md. enabled = false (default) = the sessions never
# run (dark-mergeable).
[socialization]
enabled = false
schedule = "0 30 9 * * *"
turn_budget = 3
pairs = [
    ["premiere", "chief-of-staff"],
    ["chief-of-staff", "crew-chief"],
    ["chief-of-staff", "hrmaster"],
    ["chief-of-staff", "governor"],
    ["crew-chief", "dispatcher"],
    ["crew-chief", "identity-warden"],
    ["hrmaster", "compass"],
]
