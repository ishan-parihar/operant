# cargo-deny configuration — supply-chain gate.
#
# Run with:
#   cargo install cargo-deny --locked
#   cargo deny check          # or: cargo deny check advisories licenses
#
# Deliberately NOT wired into ci.yml or self-test.sh. Two reasons, both about a
# gate nobody can pass being worse than no gate:
#
#  1. cargo-deny is not a build dependency of this workspace, so adding it to a
#     workflow means a `cargo install` (a ~2 min compile) on every run, on a
#     repository whose Actions quota is already exhausted (see the ci.yml
#     header).
#  2. The license allow-list below is a STARTING POINT derived from what a Rust
#     agent stack pulls in, not from a measured `cargo deny check` of this exact
#     lockfile. It is expected to need additions on first real run. Landing it
#     red would mean a permanently-ignored check, which is the failure mode this
#     file is meant to prevent.
#
# So: this file is the policy. Enabling it is a follow-up that starts with
# `cargo deny check licenses` and adding whatever it legitimately flags.

[graph]
# The workspace has git dependencies (memory-wire, sourcehound). cargo-deny has
# to be told to traverse them or their advisories are invisible — a vulnerability
# in a transitive dep of a git dep is exactly the case this file exists to catch.
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
# A published advisory fails the check. No ignore list: if a real advisory
# lands, it should be visible in the diff and triaged deliberately, not absorbed
# by a blanket exemption.
ignore = []
# The RUSTSEC advisory DB occasionally lists an unmaintained crate with no fix
# and no exploit path. Those are real signals, not noise, so they are NOT
# filtered out by default — the version here just records the intent.
unmaintained = "workspace"

[licenses]
version = 2
# This is a permissively licensed project (MIT OR Apache-2.0), so the gate is
# "no new copyleft arrives in the tree" rather than a full audit.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
# Confidence in an SPDX expression inferred from a LICENSE file. "high" keeps
# the check strict: a crate with only a license *file* and no detectable SPDX
# id is reported rather than silently passed.
confidence-threshold = 0.8
# Crates in this workspace are unpublished, so they carry no license metadata
# and would otherwise be reported as unlicensed.
exceptions = []

[licenses.private]
# Workspace members only. A third-party crate with no license is a real finding.
ignore = true

[bans]
# Duplicate versions are reported, not denied. This workspace is a 16-crate
# agent stack; pinning every transitive dep to one version is not achievable
# without a long tail of patches, and the skip list would grow faster than it
# shrinks. Reported-but-not-denied keeps the signal visible in the output.
multiple-versions = "warn"
wildcards = "deny"
# A wildcard dependency (`foo = "*"`) means an unreviewed version can arrive
# with a plain `cargo update`. Denied.
allow-wildcard-paths = false
# NOTE: no `deny = [{ name = "git dependencies" }]` here, even though git deps
# are the largest supply-chain risk in a graph this wide. It cannot be both
# denied here and allowed under [sources]: operant-core depends on
# memory-wire from git (pinned to the v0.4.0 rev, crates/operant-core/Cargo.toml:84),
# so that entry would make this check permanently red and therefore permanently
# ignored. The pin plus the [sources] allow-list below is the real control —
# a specific, reviewed rev, and no other git source permitted. The sourcehound
# git dep is commented out in the manifest, so it is not in the allow-list.
deny = []
skip = []
skip-tree = []

[sources]
# Only crates.io and the two first-party git dependencies named in Cargo.toml
# are acceptable. Anything else — a random git URL, a local path outside the
# workspace, an alternative registry mirror — is a finding, because it means
# code arrives from a source no one reviewed.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Workspace-local path dependencies are legitimate and are not "unknown".
# memory-wire is the only ACTIVE git dependency (pinned to a rev, not a branch);
# sourcehound is commented out in crates/operant-core/Cargo.toml:85, so allowing
# it here would permit a source the build does not currently use.
allow-git = [
    "https://github.com/ishan-parihar/memory-wire",
]
