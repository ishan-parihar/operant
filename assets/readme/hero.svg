<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="title desc">
  <title id="title">Operant — your terminal-native AI agent</title>
  <desc id="desc">A terminal window showing an Operant ReAct session: a query is split into think, act (web_search, browser_cdp, memory_store) and observe steps, finishing with a summary. Title reads OPERANT with the tagline "Your terminal-native AI agent".</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e1626"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>
  <rect x="32" y="32" width="1136" height="276" rx="18" fill="none" stroke="#1e2a4a" stroke-width="1"/>

  <!-- ── Title block ───────────────────────────────────────────── -->
  <g transform="translate(64 54)">
    <text x="0" y="0" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace"
          font-size="19" font-weight="600" letter-spacing="4" fill="#f59e0b">RUST AGENT RUNTIME</text>

    <text x="0" y="84" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif"
          font-size="92" font-weight="800" fill="#f1f5f9">OPERANT</text>

    <text x="0" y="136" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif"
          font-size="26" font-weight="500" fill="#cbd5e1">Your terminal-native AI agent — memory, skills,</text>
    <text x="0" y="170" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif"
          font-size="26" font-weight="500" fill="#cbd5e1">50+ tools, MCP, and channels under your control.</text>

    <text x="0" y="222" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace"
          font-size="18" fill="#7c8db5">v0.1.4 <tspan fill="#f59e0b">·</tspan> edition 2024
          <tspan fill="#f59e0b">·</tspan> ReAct loop <tspan fill="#f59e0b">·</tspan> local-first
          <tspan fill="#f59e0b">·</tspan> zero telemetry</text>

    <g transform="translate(0 252)">
      <rect width="118" height="34" rx="17" fill="#111c33" stroke="#243252" stroke-width="1"/>
      <text x="59" y="22" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace"
            font-size="16" font-weight="600" fill="#e2e8f0">Rust 1.89+</text>
      <rect x="130" width="86" height="34" rx="17" fill="#111c33" stroke="#243252" stroke-width="1"/>
      <text x="173" y="22" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace"
            font-size="16" font-weight="600" fill="#e2e8f0">MCP 1.0</text>
      <rect x="228" width="118" height="34" rx="17" fill="#111c33" stroke="#243252" stroke-width="1"/>
      <text x="287" y="22" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace"
            font-size="16" font-weight="600" fill="#34d399">local-first</text>
    </g>
  </g>

  <!-- ── Terminal proof ─────────────────────────────────────────── -->
  <g transform="translate(660 48)">
    <rect width="480" height="244" rx="14" fill="#0a1220" stroke="#243252" stroke-width="1"/>

    <!-- title bar -->
    <circle cx="24" cy="22" r="6" fill="#f87171"/>
    <circle cx="44" cy="22" r="6" fill="#fbbf24"/>
    <circle cx="64" cy="22" r="6" fill="#34d399"/>
    <text x="240" y="27" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace"
          font-size="15" fill="#7c8db5">operant — agent session</text>
    <line x1="0" y1="42" x2="480" y2="42" stroke="#1a2540" stroke-width="1"/>

    <!-- session lines -->
    <text x="20" y="78" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="19" fill="#f59e0b">❯</text>
    <text x="42" y="78" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="19" fill="#e2e8f0">operant run --query "audit the browser stack"</text>

    <text x="20" y="108" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="18" fill="#7c8db5">think   · plan: verify stealth CDP + IGS web tools</text>

    <text x="20" y="138" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="18" fill="#7c8db5">act     · <tspan fill="#34d399">web_search</tspan>  → 5 results</text>
    <text x="20" y="164" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="18" fill="#7c8db5">act     · <tspan fill="#34d399">browser_cdp</tspan> → LP.getMarkdown ✓</text>
    <text x="20" y="190" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="18" fill="#7c8db5">observe · <tspan fill="#34d399">memory_store</tspan> → 2 memories saved</text>

    <line x1="20" y1="210" x2="460" y2="210" stroke="#1a2540" stroke-width="1"/>
    <text x="20" y="232" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="18" fill="#f59e0b">✓ done in 4.2s — 3 tools, 0 errors</text>
  </g>
</svg>
