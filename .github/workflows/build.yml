name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs were billing in parallel: 190 runs had accumulated with no
# concurrency group anywhere, so a newer push did not cancel the older one.
# cancel-in-progress makes the newest run the only one that counts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: operant-linux-x86_64
            bin: operant
            archive: tar.gz
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: operant-macos-arm64
            bin: operant
            archive: tar.gz
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: operant-windows-x86_64
            bin: operant.exe
            archive: zip

    steps:
      # NOTE: no `submodules: recursive` here, deliberately — and it is NOT an
      # oversight to be "fixed" by copying the test workflow. `vendor/prime-agent`
      # is only used by the `[pk]` sidecar, which ships `enabled = false`, and
      # this was verified rather than assumed: in a worktree with
      # `git submodule status` showing `-` (uninitialised) and `vendor/prime-agent/`
      # empty, `cargo build --workspace` — the exact command below — completes
      # with exit 0.
      #
      # It is worth the asymmetry because a submodule is a hard external
      # dependency on a third-party repo being reachable. If that repo is renamed,
      # made private, or briefly unavailable, every release breaks for a component
      # nobody enabled. test.yml still initialises submodules, because the 6
      # `tools::kernel` tests genuinely need it at RUN time and fail without it.
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The workspace is self-contained (AGENTS.md "Path Dependencies": no
      # external git path deps). The historical tdg-rust clone step was
      # removed with them.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # System libraries the dependency graph needs at BUILD time. This step was
      # entirely absent, which is why the release-gating Linux leg could not
      # build: `alsa-sys` panicked with "Package alsa was not found in the
      # pkg-config search path", and the cross legs died the same way on
      # `openssl-sys`. A workflow that has never once built is a workflow that
      # can never publish, and `release.yml` gates on this workflow's conclusion.
      #
      # Why these, traced rather than guessed (`cargo tree -i alsa-sys`):
      #   libasound2-dev  alsa-sys    <- cpal <- kokoro-tiny <- operant-core (TTS audio out)
      #   libssl-dev      openssl-sys
      #   libclang-dev    bindgen, for the ONNX Runtime / espeak bindings
      #   cmake           espeak-rs-sys builds espeak-ng from source
      #   pkg-config      the probe mechanism all of the above are found through
      #
      # alsa is Linux-only; cpal uses CoreAudio on macOS and WASAPI on Windows,
      # so the guard keeps those runners from running apt-get.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libasound2-dev \
            libssl-dev \
            libclang-dev \
            cmake \
            pkg-config

      - name: Build
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.bin }}"
          rm "dist/${{ matrix.bin }}"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          Compress-Archive -Path "dist/${{ matrix.bin }}" -DestinationPath "dist/${{ matrix.artifact }}.zip" -Force
          Remove-Item "dist/${{ matrix.bin }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.${{ matrix.archive }}

  cross:
    name: Cross (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Best-effort by design, and the reasoning is load-bearing: release.yml
    # gates on the WHOLE Build workflow's conclusion
    # (`github.event.workflow_run.conclusion == 'success'`), and a workflow is
    # `failure` if any job is. So without this, a single unbuildable target
    # silently blocks every release forever while the native binaries sit
    # complete and unpublishable. Android needs an NDK and FreeBSD needs a
    # sysroot that `cross` does not always provide, so "will every one of these
    # six link on any given run" is not a safe thing to bet a release on.
    #
    # `gh run download` in release.yml fetches whatever artifacts exist, so
    # marking these non-fatal does not break publishing — it just stops them
    # from vetoing it. Failures are still visible on the Build run.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 musl
            target: x86_64-unknown-linux-musl
            artifact: operant-linux-x86_64-musl
          - name: Linux ARM64 musl
            target: aarch64-unknown-linux-musl
            artifact: operant-linux-arm64-musl
          - name: Linux ARM64
            target: aarch64-unknown-linux-gnu
            artifact: operant-linux-arm64
          - name: Linux ARMv7
            target: armv7-unknown-linux-gnueabihf
            artifact: operant-linux-armv7
          - name: Android ARM64
            target: aarch64-linux-android
            artifact: operant-android-arm64
          - name: FreeBSD x86_64
            target: x86_64-unknown-freebsd
            artifact: operant-freebsd-x86_64

    steps:
      # See the note in the `native` job: submodules are deliberately not
      # initialised, and `cargo build --workspace` was verified to succeed
      # without them.
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: cross build --workspace --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/operant" "dist/operant"
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" operant
          rm "dist/operant"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz
