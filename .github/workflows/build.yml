name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: operant-linux-x86_64
            bin: operant
            archive: tar.gz
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: operant-macos-arm64
            bin: operant
            archive: tar.gz
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: operant-windows-x86_64
            bin: operant.exe
            archive: zip

    steps:
      # NOTE: no `submodules: recursive` here, deliberately — and it is NOT an
      # oversight to be "fixed" by copying the test workflow. `vendor/prime-agent`
      # is only used by the `[pk]` sidecar, which ships `enabled = false`, and
      # this was verified rather than assumed: in a worktree with
      # `git submodule status` showing `-` (uninitialised) and `vendor/prime-agent/`
      # empty, `cargo build --workspace` — the exact command below — completes
      # with exit 0.
      #
      # It is worth the asymmetry because a submodule is a hard external
      # dependency on a third-party repo being reachable. If that repo is renamed,
      # made private, or briefly unavailable, every release breaks for a component
      # nobody enabled. test.yml still initialises submodules, because the 6
      # `tools::kernel` tests genuinely need it at RUN time and fail without it.
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The workspace is self-contained (AGENTS.md "Path Dependencies": no
      # external git path deps). The historical tdg-rust clone step was
      # removed with them.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # System libraries the dependency graph needs at BUILD time. This step was
      # entirely absent, which is why the release-gating Linux leg could not
      # build: `alsa-sys` panicked with "Package alsa was not found in the
      # pkg-config search path", and the cross legs died the same way on
      # `openssl-sys`. A workflow that has never once built is a workflow that
      # can never publish, and `release.yml` gates on this workflow's conclusion.
      #
      # Why these, traced rather than guessed (`cargo tree -i alsa-sys`):
      #   libasound2-dev  alsa-sys    <- cpal <- kokoro-tiny <- operant-core (TTS audio out)
      #   libssl-dev      openssl-sys
      #   libclang-dev    bindgen, for the ONNX Runtime / espeak bindings
      #   cmake           espeak-rs-sys builds espeak-ng from source
      #   pkg-config      the probe mechanism all of the above are found through
      #
      # alsa is Linux-only; cpal uses CoreAudio on macOS and WASAPI on Windows,
      # so the guard keeps those runners from running apt-get.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libasound2-dev \
            libssl-dev \
            libclang-dev \
            cmake \
            pkg-config

      - name: Provision ONNX Runtime
        # operant-core depends on kokoro-tiny unconditionally, so ort-sys always
        # links and a runner without the runtime fails at the link step
        # ("linking with `cc` failed" -- measured). The apt list above installs
        # no ONNX Runtime, so the Linux artifact was unbuildable without this.
        # Linux only: the tarball below is the Linux x64 build, and the native
        # job gates the release, so an unconditional download would break the
        # macOS and Windows legs rather than just skipping them.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ONNX_VERSION="1.20.1"
          mkdir -p local
          curl -fsSL -o /tmp/onnxruntime.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ONNX_VERSION}/onnxruntime-linux-x64-${ONNX_VERSION}.tgz"
          tar -xzf /tmp/onnxruntime.tgz -C local
          echo "ORT_LIB_LOCATION=$PWD/local/onnxruntime-linux-x64-${ONNX_VERSION}/lib" \
            >> "$GITHUB_ENV"

      - name: Build
        # RUSTFLAGS carries the rpath so the published binary knows where its
        # shared library lives. scripts/dev-env.sh sets this, but CI never
        # sources it, so without this line the artifacts depend on the caller's
        # environment to find libonnxruntime -- the same defect iter-425 removed
        # from ~/.local/bin/operant.
        #
        # $ORIGIN/lib/operant, not $ORIGIN/../lib/operant: the tarball places
        # lib/ beside the binary, so the parent-relative form does not resolve.
        # Measured both ways -- the ../ form leaves 1 unresolved library and an
        # extracted copy exits 127; this form leaves 0.
        run: |
          RUSTFLAGS="-L native=$ORT_LIB_LOCATION -C link-arg=-Wl,-rpath,\$ORIGIN/lib/operant" \
            cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package (unix)
        # Linux only. ONNX Runtime is provisioned only on the Linux leg (the
        # tarball above is the Linux x64 build), and the loader check below is
        # `ldd`, which cannot read a Mach-O at all. Both halves of this step are
        # Linux-specific; running it on macOS would exit 1 on an unset
        # ORT_LIB_LOCATION and turn a release fix into a release break.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          # The rpath baked into the binary is $ORIGIN/lib/operant, so the
          # shared library has to travel with it or every published artifact
          # exits 127 with "cannot open shared object file". Ship both.
          if [ -d "$ORT_LIB_LOCATION" ]; then
            mkdir -p dist/lib/operant
            cp -a "$ORT_LIB_LOCATION"/libonnxruntime.so* dist/lib/operant/
          else
            echo "::error::ORT_LIB_LOCATION unset; packaging a binary that cannot start" >&2
            exit 1
          fi
          # Unpack exactly as a user would, then let the loader decide whether
          # the artifact works. An artifact that was never executed is an
          # assumption, and assuming is what produced the 127 in iter-425.
          ( cd dist && tar -czf "artifact.tar.gz" "${{ matrix.bin }}" lib )
          rm -rf /tmp/artifact-check && mkdir -p /tmp/artifact-check
          tar -xzf dist/artifact.tar.gz -C /tmp/artifact-check
          MISSING=$(ldd "/tmp/artifact-check/${{ matrix.bin }}" | grep -c 'not found' || true)
          if [ "$MISSING" != "0" ]; then
            echo "::error::artifact has $MISSING unresolved shared libraries" >&2
            ldd "/tmp/artifact-check/${{ matrix.bin }}" >&2
            exit 1
          fi
          mv dist/artifact.tar.gz "dist/${{ matrix.artifact }}.tar.gz"
          rm -rf "dist/${{ matrix.bin }}" dist/lib /tmp/artifact-check

      - name: Package (macOS)
        # No ONNX provisioning and no ldd check here: the Linux-only step above
        # does not run on this leg, and ldd cannot read Mach-O. Packaging is the
        # pre-existing behaviour, unchanged.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.bin }}"
          rm "dist/${{ matrix.bin }}"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          Compress-Archive -Path "dist/${{ matrix.bin }}" -DestinationPath "dist/${{ matrix.artifact }}.zip" -Force
          Remove-Item "dist/${{ matrix.bin }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.${{ matrix.archive }}

  cross:
    name: Cross (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Best-effort by design, and the reasoning is load-bearing: release.yml
    # gates on the WHOLE Build workflow's conclusion
    # (`github.event.workflow_run.conclusion == 'success'`), and a workflow is
    # `failure` if any job is. So without this, a single unbuildable target
    # silently blocks every release forever while the native binaries sit
    # complete and unpublishable. Android needs an NDK and FreeBSD needs a
    # sysroot that `cross` does not always provide, so "will every one of these
    # six link on any given run" is not a safe thing to bet a release on.
    #
    # `gh run download` in release.yml fetches whatever artifacts exist, so
    # marking these non-fatal does not break publishing — it just stops them
    # from vetoing it. Failures are still visible on the Build run.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 musl
            target: x86_64-unknown-linux-musl
            artifact: operant-linux-x86_64-musl
          - name: Linux ARM64 musl
            target: aarch64-unknown-linux-musl
            artifact: operant-linux-arm64-musl
          - name: Linux ARM64
            target: aarch64-unknown-linux-gnu
            artifact: operant-linux-arm64
          - name: Linux ARMv7
            target: armv7-unknown-linux-gnueabihf
            artifact: operant-linux-armv7
          - name: Android ARM64
            target: aarch64-linux-android
            artifact: operant-android-arm64
          - name: FreeBSD x86_64
            target: x86_64-unknown-freebsd
            artifact: operant-freebsd-x86_64

    steps:
      # See the note in the `native` job: submodules are deliberately not
      # initialised, and `cargo build --workspace` was verified to succeed
      # without them.
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: cross build --workspace --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/operant" "dist/operant"
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" operant
          rm "dist/operant"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz
