name: CI

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The gate script is the repo's ONLY pre-merge lint rule, so CI must
      # run the same predicate rather than a second, stricter one. Raw
      # `clippy -D warnings` disagrees with .ci/clippy-allowlist.txt: it
      # would fail on the 8 pre-existing warnings the allowlist absorbs,
      # making "CI green" and "local gate green" different statements.
      - name: Install jq (gate dependency)
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Clippy gate
        # RUSTFLAGS is cleared here, and that is load-bearing. The workflow
        # sets -Dwarnings globally; cargo layers it on top of the gate's own
        # -D clippy::unwrap_used -D clippy::expect_used. Measured both ways:
        # with RUSTFLAGS="" the gate reports the true seen=8 / new=0 /
        # stale=0; with -Dwarnings inherited, cargo clippy ABORTS on the
        # first denied warning, so the gate collects seen=1 against an
        # 8-entry allowlist (stale=7) and STILL exits 0. It does not go red
        # — it goes blind, reporting green after linting a fraction of the
        # tree, with 7 valid allowlist entries spuriously flagged stale.
        env:
          RUSTFLAGS: ""
        run: bash scripts/clippy-warning-gate.sh

  doc:
    name: Documentation
    # Previously gated off with an `if:` that was always false, because this
    # reported 72 errors. The count is now zero (iter-441), so the gate is
    # live and rustdoc regressions fail CI instead of accumulating silently.
    #
    # What the 72 were: 19 unclosed HTML tags (generic-type syntax and
    # placeholder angles in doc comments, which rustdoc parses as HTML), 6
    # bare URLs, 16 square brackets used as decoration in ASCII-art dialog
    # previews (a bracketed key reads as an intra-doc link), 9 public-docs
    # links to private items, and 22 stale or unresolvable symbol references.
    #
    # This comment used to cite "BUGS.md R40-19" as the source of truth for
    # the count. No such entry exists in BUGS.md — it was never filed there,
    # so the number was only ever recorded here. Replaced rather than
    # re-pointed, since there was nothing to point at.
    #
    # Measure with --all-features. Without it the count is a FLOOR, not a
    # truth: a crate that fails to compile never reports its doc errors.
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  msrv:
    name: MSRV Check (1.89)
    # GATED OFF until measured: no run on 1.89 has happened in this repo, so
    # enabling it on pushes to main would add an unverified red to every
    # commit. Verify `cargo check --workspace` on 1.89 locally, then remove
    # this line.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
