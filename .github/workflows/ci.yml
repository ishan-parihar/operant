name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The gate script is the repo's ONLY pre-merge lint rule, so CI must
      # run the same predicate rather than a second, stricter one. Raw
      # `clippy -D warnings` disagrees with .ci/clippy-allowlist.txt: it
      # would fail on the 8 pre-existing warnings the allowlist absorbs,
      # making "CI green" and "local gate green" different statements.
      - name: Install jq (gate dependency)
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Clippy gate
        # RUSTFLAGS is cleared for this step: the workflow sets -Dwarnings
        # globally, and cargo applies it on top of the gate's own
        # -D clippy::unwrap_used -D clippy::expect_used. That would promote
        # every non-deny warning the allowlist absorbs to a hard error, so
        # CI would fail where the local gate passes — the exact divergence
        # this change removes.
        env:
          RUSTFLAGS: ""
        run: bash scripts/clippy-warning-gate.sh

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  msrv:
    name: MSRV Check (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
