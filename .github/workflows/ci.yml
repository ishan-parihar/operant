name: CI

# The GitHub Actions quota is exhausted, so CI no longer runs on every push.
# Pushing to main used to cost a 2-minute run each time, and this repo takes
# many commits a day from more than one agent, which is what drained it.
#
# What this means in practice: the local loop is now the gate. Before pushing,
# run the same checks the jobs run:
#
#   source scripts/dev-env.sh
#   export CARGO_TARGET_DIR=$HOME/.cache/operant-target
#   cargo fmt --all --check
#   bash scripts/clippy-warning-gate.sh
#   RUSTDOCFLAGS=-Dwarnings cargo doc --workspace --no-deps --all-features
#   cargo test --workspace                                      # the full suite
#   cargo test -p operant-cli --test doctor_exit_code           # the e2e doctor gate
#
# The workspace suite is the one to run: it is the only thing that executes the
# 3,751 test functions, and with no push trigger nothing runs them automatically.
# It takes a while on a 2-CPU box -- budget the time rather than skipping it.
#
# A v* tag triggers build.yml and test.yml, so a release is still verified; the
# local loop above is what stands in for this workflow in the meantime.
# `workflow_dispatch` only. There is deliberately no `push` trigger at all --
# not even on a v* tag -- because the Actions quota is exhausted and a tag push
# would auto-run the full fmt + clippy + doc + matrix at exactly the moment a
# release is being cut. build.yml and test.yml also trigger on v* tags, so a
# release is still verified; this is the job that would be redundant with them.
# Re-add `push: branches: ['main']` when quota is available.
on:
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs were billing in parallel: 190 runs had accumulated with no
# concurrency group anywhere, so a newer push did not cancel the older one.
# cancel-in-progress makes the newest run the only one that counts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The gate script is the repo's ONLY pre-merge lint rule, so CI must
      # run the same predicate rather than a second, stricter one. Raw
      # `clippy -D warnings` disagrees with .ci/clippy-allowlist.txt: it
      # would fail on the 8 pre-existing warnings the allowlist absorbs,
      # making "CI green" and "local gate green" different statements.
      - name: Install jq (gate dependency)
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Clippy gate
        # RUSTFLAGS is cleared here, and that is load-bearing. The workflow
        # sets -Dwarnings globally; cargo layers it on top of the gate's own
        # -D clippy::unwrap_used -D clippy::expect_used. Measured both ways:
        # with RUSTFLAGS="" the gate reports the true seen=8 / new=0 /
        # stale=0; with -Dwarnings inherited, cargo clippy ABORTS on the
        # first denied warning, so the gate collects seen=1 against an
        # 8-entry allowlist (stale=7) and STILL exits 0. It does not go red
        # — it goes blind, reporting green after linting a fraction of the
        # tree, with 7 valid allowlist entries spuriously flagged stale.
        env:
          RUSTFLAGS: ""
        run: bash scripts/clippy-warning-gate.sh

  doc:
    name: Documentation
    # Previously gated off with an `if:` that was always false, because this
    # reported 72 errors. The count is now zero (iter-441), so the gate is
    # live and rustdoc regressions fail CI instead of accumulating silently.
    #
    # What the 72 were: 19 unclosed HTML tags (generic-type syntax and
    # placeholder angles in doc comments, which rustdoc parses as HTML), 6
    # bare URLs, 16 square brackets used as decoration in ASCII-art dialog
    # previews (a bracketed key reads as an intra-doc link), 9 public-docs
    # links to private items, and 22 stale or unresolvable symbol references.
    #
    # This comment used to cite "BUGS.md R40-19" as the source of truth for
    # the count. No such entry exists in BUGS.md — it was never filed there,
    # so the number was only ever recorded here. Replaced rather than
    # re-pointed, since there was nothing to point at.
    #
    # Measure with --all-features. Without it the count is a FLOOR, not a
    # truth: a crate that fails to compile never reports its doc errors.
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # System libraries the dependency graph needs at build time. Without this
      # the job fails in `alsa-sys` before rustdoc ever runs — and because the
      # job used to be gated off entirely, nobody saw that. Re-enabling the gate
      # at iter-441 exposed a pre-existing environment gap rather than causing
      # one; the gate is working correctly by reporting it.
      #
      # Same package set, and the same traced reason, as the `native` job in
      # build.yml where iter-442 added it. `cargo doc` compiles the workspace, so
      # it needs the same `-sys` crates a build does — `--all-features` in
      # particular pulls the optional audio stack in through kokoro-tiny.
      # Traced via `cargo tree -i alsa-sys`; see that commit for the full chain.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libasound2-dev \
            libssl-dev \
            libclang-dev \
            cmake \
            pkg-config
      - run: cargo doc --workspace --no-deps --all-features

  msrv:
    name: MSRV Check (1.89)
    # GATED OFF until measured: no run on 1.89 has happened in this repo, so
    # enabling it on pushes to main would add an unverified red to every
    # commit. Verify `cargo check --workspace` on 1.89 locally, then remove
    # this line.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
