[workspace]
resolver = "2"
members = [
    "crates/hermes-core",
    "crates/hermes-cli",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
authors = ["eikarna"]
license = "MIT OR Apache-2.0"
rust-version = "1.86"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"

# Networking
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
config = { version = "0.14", default-features = false, features = ["toml"] }
dirs = "5.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
futures = "0.3"
pin-project = "1.1"
bytes = "1.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
futures-util = "0.3"
url = "2.5"
tokio-tungstenite = "0.24"

# HTTP server
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Terminal UI
ratatui = "=0.28.1"
crossterm = "0.28"
unicode-width = "0.2"

# Skills lifecycle
dialoguer = "0.11"
tar = "0.4"
flate2 = "1.0"
rand = "0.8"
tempfile = "3.10"

# Graph memory infrastructure
tdg-rust = { path = "../../tdg-rust" }

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
