[workspace]
resolver = "2"
members = [
    "crates/operant-api",
    "crates/operant-config",
    "crates/operant-core",
    "crates/operant-cli",
    "crates/operant-providers",
    "crates/operant-channels",
    "crates/operant-memory",
    "crates/operant-plugins",
    "crates/operant-gateway",
    "crates/operant-infra",
    "crates/operant-macros",
    "crates/operant-tools",
    "crates/operant-runtime",
    "crates/operant-hardware",
    "crates/operant-tool-call-parser",
    "crates/operant-tool-planning",
    "crates/robot-kit",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
authors = ["eikarna"]
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Internal workspace crates
operant-api = { path = "crates/operant-api" }
operant-config = { path = "crates/operant-config" }
operant-providers = { path = "crates/operant-providers" }
operant-channels = { path = "crates/operant-channels" }
operant-memory = { path = "crates/operant-memory" }
operant-plugins = { path = "crates/operant-plugins" }
operant-gateway = { path = "crates/operant-gateway" }
operant-infra = { path = "crates/operant-infra" }
operant-macros = { path = "crates/operant-macros" }
operant-tools = { path = "crates/operant-tools" }
operant-runtime = { path = "crates/operant-runtime" }
operant-hardware = { path = "crates/operant-hardware" }
operant-tool-call-parser = { path = "crates/operant-tool-call-parser" }
operant-tool-planning = { path = "crates/operant-tool-planning" }
operant-robot-kit = { path = "crates/robot-kit" }

# Async runtime
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"

# Networking
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.2", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
futures = "0.3"
pin-project = "1.1"
bytes = "1.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
futures-util = "0.3"
url = "2.5"
tokio-tungstenite = "0.29"
tokio-stream = "0.1"
tokio-util = "0.7"
tokio-rustls = { version = "0.26", features = ["ring", "logging", "tls12"] }
uuid = { version = "1.7", features = ["v4", "std"] }
chrono = { version = "0.4", features = ["clock", "std", "serde"] }
parking_lot = "0.12"
shellexpand = "3.1"
directories = "6.0"
ring = "0.17"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"

# HTTP server
axum = { version = "0.8", default-features = false, features = ["json", "ws", "macros", "tokio", "query", "http1"] }
tower = { version = "0.4", features = ["make"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Terminal UI
ratatui = "0.29"
crossterm = "0.29"
unicode-width = "0.2"

# Skills lifecycle
dialoguer = "0.11"
tar = "0.4"
flate2 = "1.0"
rand = "0.8"
tempfile = "3.10"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(operant_root_crate)'] }

# NOTE: manifest-level clippy denies (`unwrap_used`/`expect_used`) cannot be
# used here — this environment's cargo build rejects `lints` manifest keys
# ("unused manifest key: package.lints"). Enforcement lives in
# scripts/clippy-warning-gate.sh via explicit `-D clippy::unwrap_used` and
# `-D clippy::expect_used` flags; justified sites carry `#[expect(...)]`
# attributes with reasons (see docs/RUST_BEST_PRACTICES_PLAN.md Phase 2b).

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
