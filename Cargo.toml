[workspace]
resolver = "2"
members = [
    "crates/operant-api",
    "crates/operant-os",
    "crates/operant-config",
    "crates/operant-core",
    "crates/operant-cli",
    "crates/operant-plugins",
    "crates/operant-harness",
]
exclude = ["vendor/ndarray-npy", "vendor/kokoro-tiny"]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["eikarna"]
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
# Internal workspace crates
operant-api = { path = "crates/operant-api" }
operant-config = { path = "crates/operant-config" }
operant-plugins = { path = "crates/operant-plugins" }
operant-harness = { path = "crates/operant-harness" }
operant-os = { path = "crates/operant-os" }

# Async runtime
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"

# Networking
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls", "blocking"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.2", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
futures = "0.3"
bytes = "1.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
futures-util = "0.3"
url = "2.5"
tokio-tungstenite = "0.29"
tokio-stream = "0.1"
tokio-util = "0.7"
# `default-features = false` matters: tokio-rustls's default features pull
# in `aws_lc_rs`, and with `ring` ALSO enabled the rustls crypto provider
# is ambiguous — `rustls::ClientConfig::builder()` panics with "Could not
# automatically determine the process-level CryptoProvider from Rustls
# crate features". That panic was in the Email adapter's TLS setup and in
# the proxy's TLS setup, so both were broken.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
uuid = { version = "1.7", features = ["v4", "std"] }
chrono = { version = "0.4", features = ["clock", "std", "serde"] }
parking_lot = "0.12"
shellexpand = "3.1"
directories = "6.0"
ring = "0.17"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"

# HTTP server
axum = { version = "0.8", default-features = false, features = ["json", "ws", "macros", "tokio", "query", "http1"] }

# Terminal UI
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"

# Skills lifecycle
dialoguer = "0.11"
tar = "0.4"
flate2 = "1.0"
rand = "0.8"
tempfile = "3.10"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(operant_root_crate)'] }

# NOTE: manifest-level clippy denies (`unwrap_used`/`expect_used`) cannot be
# used here — this environment's cargo build rejects `lints` manifest keys
# ("unused manifest key: package.lints"). Enforcement lives in
# scripts/clippy-warning-gate.sh via explicit `-D clippy::unwrap_used` and
# `-D clippy::expect_used` flags; justified sites carry `#[expect(...)]`
# attributes with reasons (see docs/RUST_BEST_PRACTICES_PLAN.md Phase 2b).

[profile.release]
lto = true
strip = true
panic = "unwind"  # a panic in an optional subsystem (ort, BUGS CR-1) must reach a JoinError, not abort the process
codegen-units = 1

# Advisory lints wired workspace-wide (see BUGS.md audit notes).
# redundant_clone intentionally excluded: 136 nursery-level hits require a
# dedicated sweep arc; adding it at warn would fail the -D warnings gate.
[workspace.lints.clippy]
clone_on_copy = "warn"
needless_borrow = "warn"

# RT-18: kokoro-tiny -> ndarray-npy 0.9 pins zip 2, and every zip below 9.0.0 is in RUSTSEC-2026-0367/0368/0369.
# This patch keeps the same ndarray-npy API and bumps only its zip requirement; see vendor/ndarray-npy/README.md.
[patch.crates-io]
ndarray-npy = { path = "vendor/ndarray-npy" }
# kokoro-tiny 0.1.0 uses `atty` (RUSTSEC-2021-0145 unsound, RUSTSEC-2024-0375 unmaintained)
# for one stdin check in its binary; the vendored copy uses std IsTerminal. See vendor/kokoro-tiny/README.md.
kokoro-tiny = { path = "vendor/kokoro-tiny" }
