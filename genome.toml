[genome]
schema_version = 2
modules = ["core", "records", "agents", "ops"]

# kb.toml — the role→path map. Edit freely; roles keep their meaning.
[paths]
agents = "AGENTS.md"
state = "docs/handoff/STATE.md"
entry = "docs/handoff/README.md"
register = "TODO.md"
ledger = "docs/kb/CLOSED.md"
worklog = "docs/kb/WORKLOG.md"
feed = "docs/kb/feed.md"
workflows = "docs/kb/workflows"
decisions = "docs/decisions"
regressions = "docs/regressions"
plans = "docs/plans"
audits = "docs/audit"
runbook = "docs/RUNBOOK.md"
archive = "docs/archive"
# The ownership map: every active doc, the question it owns, and what it is
# NOT for. It is the "one owner per question" rule made checkable.
ownership_map = "docs/INDEX.md"
# The operator-ruling ledger: what we asked, what they ruled, and which
# owner doc the ruling was applied to.
asks = "docs/kb/ASKS.md"

# dated-frozen filename patterns: only files whose NAME carries the freeze stamp
# are date-checked. docs/plans/ also holds the frozen 2026-08 numbering series
# (001-018 — commit-stamped, not date-named) and batch subdirs; docs/audit/ holds
# the live 2026-10-16 audit batch the same way.
# legitimate non-repo references in AGENTS.md's routing table (E001 skips these)
# status vocabulary: open in-progress done rejected blocked (terminal: done rejected)

[core]
dated_pattern = "^(plan-\\d{4}-\\d{2}-\\d{2}|\\d{4}-\\d{2}-\\d{2}-)"
pointer_ignore = "SKILL.md autonomous-status.toml"

[card]
architecture = "AGENTS.md#Architecture Overview"
status_into = "docs/handoff/STATE.md"
