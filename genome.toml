[genome]
schema_version = 2
modules = ["core", "records", "agents", "ops"]

# kb.toml — the role→path map. Edit freely; roles keep their meaning.
[paths]
agents = "AGENTS.md"
state = "docs/handoff/STATE.md"
entry = "docs/handoff/README.md"
register = "TODO.md"
ledger = "docs/kb/CLOSED.md"
worklog = "docs/kb/WORKLOG.md"
feed = "docs/kb/feed.md"
workflows = "docs/kb/workflows"
decisions = "docs/decisions"
regressions = "docs/regressions"
plans = "docs/plans"
audits = "docs/audit"
runbook = "docs/RUNBOOK.md"
archive = "docs/archive"
# The ownership map: every active doc, the question it owns, and what it is
# NOT for. It is the "one owner per question" rule made checkable.
ownership_map = "docs/INDEX.md"
# The operator-ruling ledger: what we asked, what they ruled, and which
# owner doc the ruling was applied to.
asks = "docs/kb/ASKS.md"

# dated-frozen filename patterns: only files whose NAME carries the freeze stamp
# are date-checked. docs/plans/ also holds the frozen 2026-08 numbering series
# (001-018 — commit-stamped, not date-named) and batch subdirs; docs/audit/ holds
# the live 2026-10-16 audit batch the same way.
# legitimate non-repo references in AGENTS.md's routing table (E001 skips these)
# status vocabulary: open in-progress done rejected blocked (terminal: done rejected)

[core]
dated_pattern = "^(plan-\\d{4}-\\d{2}-\\d{2}|\\d{4}-\\d{2}-\\d{2}-)"
pointer_ignore = "SKILL.md autonomous-status.toml settings.json auth.json"
# Living plans carry a maintained 'Resume here' section instead of
# same-day v3 churn: an execution plan with open iterations is amended in
# place under this key, per the dated-frozen header's own escape clause.
living_plans = ["docs/plans/2026-10-28-unified-session-management-v2-jcode-picker-pane-omp-hub-empl.md"]
# the gate the repo's own iteration loop names: fast checks, then the workspace suite
gate = "./scripts/check.sh check --workspace && cargo test --workspace"
# the judgement the iteration loop makes mandatory, in its own order
checklist = [
  "the change is surgical: only what the task requires, matching existing style",
  "the iteration number in the worklog entry follows the last one",
  "the push happened, or the reason it could not is written down",
]
# generated by the tooling, never committed by close
never_commit = [".serena/**", "target/**", "**/*.genome-lock", ".genome/**"]

[card]
architecture = "AGENTS.md#Architecture Overview"
status_into = "docs/handoff/STATE.md"

[ops]
# E301: every doc in an owner location must be listed in docs/INDEX.md —
# a mechanism-library page that is not in the ownership map is lint, so the
# "cover every relevant thing" contract is machine-enforced, not aspirational.
owner_globs = ["docs/library/*.md"]
# E303: backticked file-shaped pointers in these surfaces must exist —
# library pages cite source modules, and a stale citation is a broken link
# the gate catches instead of a reader.
link_surfaces = ["docs/INDEX.md", "docs/library/*.md"]
link_prefixes = ["crates/", "scripts/", "docs/", "kernel-sidecar/"]
