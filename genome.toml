[genome]
schema_version = 2
modules = ["core", "records", "agents", "ops", "outline"]

# kb.toml — the role→path map. Edit freely; roles keep their meaning.
[paths]
agents = "AGENTS.md"
state = "docs/handoff/STATE.md"
entry = "docs/handoff/README.md"
register = "TODO.md"
ledger = "docs/kb/CLOSED.md"
worklog = "docs/kb/WORKLOG.md"
feed = "docs/kb/feed.md"
workflows = "docs/kb/workflows"
decisions = "docs/decisions"
regressions = "docs/regressions"
plans = "docs/plans"
audits = "docs/audit"
runbook = "docs/RUNBOOK.md"
archive = "docs/archive"
# The ownership map: every active doc, the question it owns, and what it is
# NOT for. It is the "one owner per question" rule made checkable.
ownership_map = "docs/INDEX.md"
# The operator-ruling ledger: what we asked, what they ruled, and which
# owner doc the ruling was applied to.
asks = "docs/kb/ASKS.md"

# dated-frozen filename patterns: only files whose NAME carries the freeze stamp
# are date-checked. docs/plans/ also holds the frozen 2026-08 numbering series
# (001-018 — commit-stamped, not date-named) and batch subdirs; docs/audit/ holds
# the live 2026-10-16 audit batch the same way.
# legitimate non-repo references in AGENTS.md's routing table (E001 skips these)
# status vocabulary: open in-progress done rejected blocked (terminal: done rejected)

[core]
dated_pattern = "^(plan-\\d{4}-\\d{2}-\\d{2}|\\d{4}-\\d{2}-\\d{2}-)"
pointer_ignore = "SKILL.md autonomous-status.toml settings.json auth.json manifest.toml plugin.yaml"
# Living plans carry a maintained 'Resume here' section instead of
# same-day v3 churn: an execution plan with open iterations is amended in
# place under this key, per the dated-frozen header's own escape clause.
living_plans = ["docs/plans/2026-11-18-composable-generative-ui-surface-ir-for-the-tui-and-the-gate.md", "docs/plans/plan-2026-11-15-context-lifecycle-residual-gaps.md", "docs/plans/2026-10-28-unified-session-management-v2-jcode-picker-pane-omp-hub-empl.md", "docs/plans/plan-2026-11-02-session-resumability-and-gateway-session-navigation.md", "docs/plans/2026-11-02-session-resumability-remaining-gaps-after-iter-1634.md", "docs/plans/plan-2026-11-02-codex-parity-composer-and-session-organiser.md", "docs/plans/plan-2026-11-03-tool-row-click-expand-acceptance.md", "docs/plans/plan-2026-11-13-codex-command-center-port.md", "docs/plans/2026-11-19-close-the-remaining-generative-ui-gaps-the-gateway-rasterise.md"]
# The two append-only ledgers carry a GENERATED table of contents: every entry
# adds a line, so a hand-written contents block is stale on the next append.
# `genome log` and `genome post` refresh the zone as part of the append, and
# E015 fails the lint if a zone is ever behind the entries.
ledger_tocs = ["docs/kb/WORKLOG.md", "docs/kb/feed.md"]
# the gate the repo's own iteration loop names: fast checks, then the workspace suite
gate = "./scripts/check.sh check --workspace && cargo test --workspace"
# the judgement the iteration loop makes mandatory, in its own order
checklist = [
  "the change is surgical: only what the task requires, matching existing style",
  "the iteration number in the worklog entry follows the last one",
  "the push happened, or the reason it could not is written down",
]
# generated by the tooling, never committed by close
never_commit = [".serena/**", "target/**", "**/*.genome-lock", ".genome/**"]

[card]
architecture = "docs/ARCHITECTURE.md"
status_into = "docs/handoff/STATE.md"

[ops]
# E301: every doc in an owner location must be listed in docs/INDEX.md —
# a mechanism-library page that is not in the ownership map is lint, so the
# "cover every relevant thing" contract is machine-enforced, not aspirational.
owner_globs = ["docs/library/*.md"]
# E303: backticked file-shaped pointers in these surfaces must exist —
# library pages cite source modules, and a stale citation is a broken link
# the gate catches instead of a reader.
link_surfaces = ["docs/INDEX.md", "docs/library/*.md"]
link_prefixes = ["crates/", "scripts/", "docs/", "kernel-sidecar/"]

# E311 — the OTHER direction from E301. E301 asks whether every doc is listed
# in the ownership map; this asks whether every code unit is NAMED by a doc.
# The mechanism library's real failure is silent: a subsystem ships, nobody
# writes its page, and no gate says so. `genome lint` now does.
# The unit is one source file and the name that must appear is its stem, so
# `crates/operant-core/src/agent/rewind.rs` is covered by any library page
# that says `rewind`. Depth is a reviewer's judgement; existence is mechanical.
coverage_surfaces = ["docs/library/*.md"]
coverage_units = ["crates/*/src/**/*.rs"]
coverage_label = "library"
# Each row is a unit with no library page AND a reason. An empty reason is not
# an exemption, it is a deferral with the paperwork missing.
# An exemption REASON lives INSIDE the string, not in a trailing comment,
# so `genome lint` can check the claim: if the reason names a library page,
# that page must really contain the unit (E311). 2026-11-17 iter-2554.
coverage_exempt = [
  "crates/operant-api/src/memory_traits.rs -> leaf; the Memory trait, owned by docs/library/memory.md",
  "crates/operant-api/src/peripherals_traits.rs -> leaf; owned by docs/library/tools.md",
  "crates/operant-api/src/runtime_traits.rs -> leaf; the RuntimeAdapter trait, owned by docs/library/agent-loop.md",
  "crates/operant-cli/src/cmd_auth.rs -> leaf; the CLI command surface entry, owned by docs/library/cli-surface.md",
  "crates/operant-cli/src/cmd_completion.rs -> leaf; the CLI command surface entry, owned by docs/library/cli-surface.md",
  "crates/operant-cli/src/cmd_continue.rs -> leaf; owned by docs/library/sessions.md",
  "crates/operant-cli/src/cmd_curator.rs -> leaf; the CLI command surface entry, owned by docs/library/cli-surface.md",
  "crates/operant-cli/src/cmd_dashboard.rs -> leaf; the CLI command surface entry, owned by docs/library/cli-surface.md",
  "crates/operant-cli/src/cmd_debug.rs -> leaf; the CLI command surface entry, owned by docs/library/cli-surface.md",
  "crates/operant-cli/src/cmd_doctor/checks_integrations.rs -> leaf; owned by docs/library/operability.md",
  "crates/operant-cli/src/cmd_dump.rs -> leaf; the CLI command surface entry, owned by docs/library/cli-surface.md",
  "crates/operant-cli/src/cmd_hooks.rs -> leaf; the CLI command surface entry, owned by docs/library/cli-surface.md",
  "crates/operant-cli/src/cmd_migrate.rs -> leaf; the CLI command surface entry, owned by docs/library/cli-surface.md",
  "crates/operant-cli/src/cmd_model.rs -> leaf; the CLI command surface entry, owned by docs/library/cli-surface.md",
  "crates/operant-cli/src/cmd_profile.rs -> leaf; the CLI command surface entry, owned by docs/library/cli-surface.md",
  "crates/operant-cli/src/cmd_sop.rs -> leaf; the CLI command surface entry, owned by docs/library/cli-surface.md",
  "crates/operant-cli/src/cmd_tools.rs -> leaf; the CLI command surface entry, owned by docs/library/cli-surface.md",
  "crates/operant-cli/src/cmd_version.rs -> leaf; the CLI command surface entry, owned by docs/library/cli-surface.md",
  "crates/operant-api/src/media.rs -> leaf; multimodal config types removed iter-2680 (dead code); the file is an empty schema stub",
  "crates/operant-core/src/config/docker_terminal.rs -> leaf; config submodule for Docker terminal provider settings",
  "crates/operant-core/src/config/ssh_terminal.rs -> leaf; config submodule for SSH terminal provider settings",
  "crates/operant-core/src/config/stt.rs -> leaf; config submodule for speech-to-text settings",
  "crates/operant-core/src/config/vision.rs -> leaf; config submodule for vision model settings",
  "crates/operant-core/src/text_slice.rs -> leaf; text-slicing utility for context window management",
]

# E019: a doc's DERIVED claim about the code must match the code. The script is the
# authority for each derivation (AGENTS.md's command count, its TUI module count,
# the gateway platform count, ...), and it is run here rather than reimplemented,
# so a claim and its check cannot drift apart.
doc_claims = "scripts/check-doc-claims.sh"
# E020: a library page's OWN internal contract must hold -- its Source: header,
# its Owns:/Not for: boundary, its sibling links, and every tool name it puts in
# a heading. E303 already covers paths, and E019 covers derived counts, but
# "this page forgot to say what it owns" was only checkable by reading all 35
# pages. The script is the authority, so the gate cannot drift from it.
library_pages = "scripts/verify-library.sh"

# The gates above are only gates while they still CONTAIN their checks. A rebase
# onto a peer's reorganized tree silently drops same-region edits, and a gate that
# loses a check still exits 0 -- proven twice: iter-2551 (verify-library.sh reverted
# to a phantom-name allowlist) and iter-2549 (check-doc-claims.sh lost its
# library tool-count block). This key names the guard that asserts each gate script
# still contains the semantic core of every check, so deletion fails instead of
# passing unnoticed. The guard lives in its own file so a rebase cannot drop the
# guard and the thing it protects in one motion.
gates_present = "scripts/check-gates-present.sh"
